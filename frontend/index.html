<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- F-4: CSP estricta. Si cambias el script en linea, recalcula su sha256 (scripts/csp_hash.py). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-Hp+w9LqPSd3iAv1cce21l/6uSD92hB7ocDmBqugPFAY='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://cognito-idp.us-east-2.amazonaws.com; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lyft Threat Intelligence</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Concepto: sidebar fija + lienzo de widgets en rejilla de 12 columnas que cada persona reordena, redimensiona y oculta.
   Blanco como base, rosa Lyft (#FF00BF) como acento; la prioridad usa una rampa ordinal del mismo rosa. */
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --soft:#FBF4FA; --soft2:#F5E9F2;
  --fg:#1E1220; --muted:#6B5A68; --line:#EBDDE8; --line2:#DCC8D8;
  --accent:#FF00BF; --accent-ink:#C4008F; --accent-soft:#FFE5F8; --on-accent:#1E0018;
  --p1:#8F0070; --p1-fg:#FFFFFF; --p2:#FF00BF; --p2-fg:#1E0018; --p3:#FF7BDB; --p3-fg:#1E0018; --p4:#EBB4DD; --p4-fg:#3A1030;
  --ok:#157A4B; --ok-bg:#E3F5EB; --warn:#9A6200; --warn-bg:#FFF1D6; --bad:#C0182F; --bad-bg:#FDE4E8;
  --shadow:0 1px 2px rgba(60,20,55,.05);
  --f-ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#140B17; --panel:#1C1120; --soft:#241829; --soft2:#2E2034;
  --fg:#F7EDF5; --muted:#B7A2B3; --line:#33243A; --line2:#47354F;
  --accent:#FF2FC8; --accent-ink:#FF6BD6; --accent-soft:#3A1535; --on-accent:#1E0018;
  --p1:#FF3DCB; --p1-fg:#1E0018; --p2:#C42B9C; --p2-fg:#FFFFFF; --p3:#8A2A73; --p3-fg:#FFFFFF; --p4:#55304F; --p4-fg:#F7EDF5;
  --ok:#5FD39A; --ok-bg:#12301F; --warn:#F2B84B; --warn-bg:#3A2A0A; --bad:#FF7A8C; --bad-bg:#3E141C;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#140B17; --panel:#1C1120; --soft:#241829; --soft2:#2E2034;
  --fg:#F7EDF5; --muted:#B7A2B3; --line:#33243A; --line2:#47354F;
  --accent:#FF2FC8; --accent-ink:#FF6BD6; --accent-soft:#3A1535; --on-accent:#1E0018;
  --p1:#FF3DCB; --p1-fg:#1E0018; --p2:#C42B9C; --p2-fg:#FFFFFF; --p3:#8A2A73; --p3-fg:#FFFFFF; --p4:#55304F; --p4-fg:#F7EDF5;
  --ok:#5FD39A; --ok-bg:#12301F; --warn:#F2B84B; --warn-bg:#3A2A0A; --bad:#FF7A8C; --bad-bg:#3E141C;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);flex:none}
.brand b{display:block;font-size:15px;letter-spacing:-.01em;line-height:1.1}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--soft);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px;display:flex;flex-direction:column;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;background:var(--soft2);font-size:12px;color:var(--muted);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
/* main */
.main{min-width:0;padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font-size:26px;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.top p{margin:4px 0 0;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);padding:8px 13px;border-radius:10px;font-weight:600;font-size:13.5px}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(.95)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:0}
.iconbtn:hover{background:var(--soft)}
/* barra personalizar */
.editbar{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.editbar .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.editbar p{margin:0;font-size:13px}
.pickers{display:flex;flex-wrap:wrap;gap:6px}
.pick{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:99px;border:1px solid var(--line2);background:var(--panel);font-size:12.5px;cursor:pointer;user-select:none}
.pick input{accent-color:var(--accent);margin:0}
.pick.on{border-color:var(--accent)}
/* rejilla */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.w{grid-column:span var(--span);min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
.w.kpi{padding:14px 16px 12px}
.w.card{padding:14px 16px 14px}
.wh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.wh h2{margin:0;font-size:14.5px;font-weight:650;letter-spacing:-.005em}
.src{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:2px;display:block}
.sel{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:4px 8px;font-size:12.5px}
.wbody{min-width:0;flex:1}
.tools{display:none;position:absolute;top:-13px;right:10px;gap:4px;background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:3px;z-index:3}
.edit .tools{display:flex}
.tools button{width:26px;height:26px;border:0;background:transparent;border-radius:7px;display:grid;place-items:center;padding:0;color:var(--fg)}
.tools button:hover{background:var(--accent-soft)}
.tools .grab{cursor:grab}
.edit .w{outline:1px dashed var(--line2);outline-offset:3px}
.edit .w.dragover{outline:2px solid var(--accent)}
.edit .w.dragging{opacity:.4}
/* kpi */
.klabel{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:8px}
.kval{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.kfoot{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.delta{font-size:12px;font-weight:600;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}.delta svg{flex:none}
.delta.bad{color:var(--bad)} .delta.good{color:var(--ok)} .delta.flat{color:var(--muted)}
.spark{width:100%;max-width:120px;height:26px}
/* tablas y listas */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.mono{font-family:var(--f-mono);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.pr1{background:var(--p1);color:var(--p1-fg)} .pr2{background:var(--p2);color:var(--p2-fg)} .pr3{background:var(--p3);color:var(--p3-fg)} .pr4{background:var(--p4);color:var(--p4-fg)}
.st-ok{background:var(--ok-bg);color:var(--ok)} .st-warn{background:var(--warn-bg);color:var(--warn)} .st-bad{background:var(--bad-bg);color:var(--bad)} .st-off{background:var(--soft2);color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0;padding-bottom:0}
.list .t{flex:1;min-width:0}
.list .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.list .t span{font-size:12px;color:var(--muted)}
.ico{width:32px;height:32px;border-radius:9px;background:var(--soft2);display:grid;place-items:center;flex:none;color:var(--muted)}
/* graficas */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:8px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.axis text{fill:var(--muted);font-size:11px;font-family:var(--f-ui)}
.grid line,.gl{stroke:var(--line)}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--fg);color:var(--bg);padding:7px 10px;border-radius:9px;font-size:12px;line-height:1.4;max-width:240px;opacity:0;transition:opacity .08s}
.tip.on{opacity:1}
.tip b{display:block;font-weight:600;margin-bottom:2px}
.stack{display:flex;height:34px;gap:2px;margin:6px 0 14px}
.stack div{border-radius:6px;min-width:6px}
.hbar{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.hbar .track{height:14px;background:var(--soft2);border-radius:5px;display:flex;gap:2px;overflow:hidden}
.hbar .track div{border-radius:4px}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bignums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bignums div{background:var(--soft);border-radius:10px;padding:10px 12px}
.bignums b{font-size:22px;letter-spacing:-.02em;display:block;font-variant-numeric:tabular-nums}
.bignums span{font-size:12px;color:var(--muted)}
/* configuracion */
.sect{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.sect h2{margin:0 0 2px;font-size:16px}
.sect>p{margin:0 0 14px;color:var(--muted);max-width:68ch}
.feedcard{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:14px 22px}
.feedcard h3{margin:0;font-size:14.5px}
.feedcard .meta{font-size:12px;color:var(--muted);margin-top:3px}
.fields{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:500;min-width:130px}
.fld select,.fld input[type=text],.fld input[type=time]{border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:7px 10px;color:var(--fg);font-size:13.5px}
.fld input[type=range]{accent-color:var(--accent)}
.code{font-family:var(--f-mono);font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 9px;color:var(--fg);display:inline-block;margin-top:6px}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--fg);cursor:pointer}
.sw input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.savebar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:12px 0;background:linear-gradient(transparent,var(--bg) 40%)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:min(92vw,520px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{color:var(--muted);padding:18px 0;text-align:center}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;gap:10px 16px;padding:12px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row}
  .side-foot{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .w{grid-column:span 12}
  .w.kpi{grid-column:span 6}
  .feedcard{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* sesion */
.meta{font-size:12px;color:var(--muted)}
.aviso{margin:0;padding:8px 10px;border-radius:9px;background:var(--bad-bg);color:var(--bad);font-size:13px}
.side-foot .btn{align-self:flex-start}
@media (max-width:900px){.side-foot{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;margin-left:auto;padding:0}body.sinsesion .side-foot{display:none}}

/* ---- login ---- */
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.sinsesion .app{grid-template-columns:1fr}
body.sinsesion .side{display:none}
body.sinsesion .main{overflow-x:clip;padding:0;min-height:100vh;display:grid;place-items:center;
  background:
    radial-gradient(60% 50% at 12% 8%, color-mix(in srgb,var(--accent) 38%,transparent), transparent 70%),
    radial-gradient(55% 55% at 92% 92%, color-mix(in srgb,var(--p1) 30%,transparent), transparent 70%),
    radial-gradient(40% 35% at 85% 12%, color-mix(in srgb,var(--p3) 26%,transparent), transparent 70%),
    var(--bg)}
.lg-wrap{width:min(400px,100%);max-width:100%;padding:24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:16px}
.lg-card{width:100%;background:color-mix(in srgb,var(--panel) 78%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));border-radius:26px;padding:34px 30px 28px;
  box-shadow:0 24px 70px color-mix(in srgb,var(--accent) 22%,transparent);display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:center}
.lg-logo{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;color:var(--accent-ink);
  border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.lg-card h1{margin:0;font-size:28px;letter-spacing:-.025em;line-height:1.15}
.lg-sub{margin:0 0 18px;color:var(--muted);font-size:14px}
.lg-form{display:flex;flex-direction:column;gap:18px;text-align:left}
.lg-f{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--line2);padding:8px 2px;transition:border-color .15s}
.lg-f:focus-within{border-color:var(--accent)}
.lg-i{display:grid;place-items:center;color:var(--muted);flex:none}
.lg-f:focus-within .lg-i{color:var(--accent-ink)}
.lg-f input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font-size:15px;padding:6px 0;outline:none}
.lg-f input::placeholder{color:var(--muted)}
.lg-eye{border:0;background:transparent;color:var(--muted);padding:4px;border-radius:8px;display:grid;place-items:center}
.lg-eye:hover{color:var(--fg)}
.lg-go{height:48px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15px;letter-spacing:.01em;
  box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 38%,transparent);transition:transform .1s,filter .15s;margin-top:4px}
.lg-go:hover{filter:brightness(.96)}
.lg-go:active{transform:translateY(1px)}
.lg-go[disabled]{opacity:.55;cursor:wait}
.lg-link{border:0;background:transparent;color:var(--accent-ink);font-weight:600;font-size:13px;padding:6px;align-self:center;text-decoration:underline;text-underline-offset:3px}
.lg-pie{margin:0;font-size:12px;color:var(--muted);text-align:center}
.lg-form .aviso{text-align:left}
.lg-form .ok{background:var(--ok-bg);color:var(--ok);margin:0;padding:8px 10px;border-radius:9px;font-size:13px}
/* Asesoría del agente: panel lateral de solo lectura */
#ase-fondo{position:fixed;inset:0;background:rgba(30,18,32,.35);z-index:60;display:flex;justify-content:flex-end}
#ase{width:min(560px,100%);height:100%;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:18px 20px 28px;box-shadow:-8px 0 24px rgba(30,18,32,.14)}
#ase header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
#ase h2{margin:0;font-size:18px} #ase header p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.ase-aviso{display:flex;gap:8px;align-items:flex-start;margin:14px 0;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13px;line-height:1.45}
.ase-aviso svg{flex:none;margin-top:3px}
.ase-prio{display:grid;gap:8px}
.ase-evol{display:grid;gap:8px}
.ase-et{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ase-et>div{border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ase-et .et-t{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.ase-et .et-v{font-size:13px;min-height:24px}
.ase-et .et-d{font-size:11.5px;color:var(--muted);line-height:1.35}
.ase-et .et-m{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin-top:5px;padding-top:6px;border-top:1px dashed var(--line);font-size:10.5px}
.ase-et .et-mk{color:var(--muted);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.ase-et .et-mv{color:var(--fg);word-break:break-word;font-variant-numeric:tabular-nums}
.ase-et>div.et-hip{border-style:dashed;background:var(--soft2)}
@media(max-width:420px){.ase-et{grid-template-columns:1fr}}
.ase-demo{margin-top:8px;font-size:12.5px;color:var(--muted)}
.ase-demo summary{cursor:pointer}
.ase-prio>div{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px}
.ase-nota,.ase-m{color:var(--muted);font-size:12.5px;line-height:1.45;margin:2px 0}
.ase-sec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.ase-sec h3{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ase-sec p{margin:6px 0;font-size:13.5px;line-height:1.5}
.ase-l{margin:6px 0;padding-left:18px;font-size:13.5px;line-height:1.5} .ase-l li{margin:5px 0}
.ase-pie{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:18px;color:var(--muted);font-size:12px}

/* ---------- usuarios del panel (solo lectura, solo admin) ---------- */
.usrs-nota{font-size:12.5px;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:16px}
.usrs-tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
.usrs-tbl table{width:100%;border-collapse:collapse;font-size:13.5px}
.usrs-tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line2);padding:6px 8px;white-space:nowrap}
.usrs-tbl td{border-bottom:1px solid var(--line);padding:8px;vertical-align:middle}
.usrs-tbl td:last-child{white-space:nowrap}
.grp-pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;margin:1px 2px}
.grp-pill.admin{background:var(--p1);color:#fff}
.grp-pill.lectura{background:var(--soft);color:var(--fg);border:1px solid var(--line)}
/* ---------- bandeja HITL ---------- */
.band-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.band-card{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.band-card.band-urg{border-color:var(--warn);background:var(--warn-bg)}
.band-n{font-size:22px;font-weight:700;line-height:1}
.band-e{font-size:12px;color:var(--muted)}
.band-h{font-size:14px;margin:20px 0 10px}
.band-tl{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.band-tl>li{border:1px solid var(--line);border-left:3px solid var(--p2);border-radius:10px;padding:10px 12px}
.band-tl-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.band-arr{color:var(--muted)}
.band-tl-meta{margin-left:auto;font-size:12px;color:var(--muted)}
.band-just{margin:6px 0 0;font-size:13px}
.band-hid{margin:4px 0 0;font-size:11px;color:var(--muted)}
/* ---------- matriz de transición ---------- */
.tran-ks{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.tran-k{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.tran-kn{font-size:22px;font-weight:700;line-height:1}
.tran-kl{font-size:12px;color:var(--muted)}
.tran-t{text-align:center}
.tran-t th,.tran-t td{padding:8px 10px;border:1px solid var(--line)}
.tran-cap{font-size:11.5px;color:var(--muted);font-weight:600;text-align:center}
.tran-rh{white-space:nowrap;font-size:12px}
.tran-cel{font-weight:700;font-size:15px}
.tran-tot{background:var(--soft);font-weight:600;color:var(--muted)}
.tran-cero{color:var(--muted);font-weight:400;background:var(--soft2)}
.tran-esc{background:var(--bad-bg);color:var(--bad)}
.tran-eq{background:var(--soft2)}
.tran-red{background:var(--ok-bg);color:var(--ok)}
.tran-k.tran-cero{background:var(--soft2);color:var(--muted)}
.tran-k.tran-esc,.tran-k.tran-eq,.tran-k.tran-red{border:none}
.tran-leg{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;border:1px solid var(--line)}
.tran-click{cursor:pointer}
.tran-click:hover,.tran-click:focus-visible,.tran-click-nc:hover,.tran-click-nc:focus-visible{outline:2px solid var(--p2);outline-offset:-2px}
.tran-k.tran-click-nc{cursor:pointer}
.tran-cel.tran-on,.tran-k.tran-on{outline:2px solid var(--fg);outline-offset:-2px}
#tran-det{margin-top:18px}
.tran-row{cursor:pointer}
.tran-row:hover,.tran-row:focus-visible{background:var(--soft)}

/* ---------- resumen semanal ---------- */
.rep{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 26px;max-width:1040px}
.rep-h{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:2px solid var(--p1);padding-bottom:12px;margin-bottom:16px}
.rep-h b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.rep-h h2{margin:2px 0 2px;font-size:22px}
.rep-h p{margin:0;color:var(--muted);font-size:13px}
.rep-conf{border:1.5px solid var(--bad);color:var(--bad);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;text-align:center;line-height:1.35;white-space:nowrap}
.rep-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.rep-k{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rep-k span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.rep-k b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.rep-k small{font-size:12px;color:var(--muted)}
.rep-k.mal b{color:var(--bad)}
.rep-2{display:grid;grid-template-columns:3fr 2fr;gap:14px;margin-bottom:14px}
.rep h3{font-size:14px;margin:0 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rep-sec{border:1px solid var(--line);border-radius:10px;padding:12px 14px;break-inside:avoid;margin-bottom:14px}
.rep-2 .rep-sec{margin-bottom:0}
.rep table{width:100%;border-collapse:collapse;font-size:13px}
.rep th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line2);padding:5px 6px}
.rep td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top}
.rep td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.rep .venc{color:var(--bad);font-weight:700}
.rep-mov{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;text-align:center}
.rep-mov div{background:var(--soft);border-radius:8px;padding:6px}
.rep-mov b{display:block;font-size:18px}
.rep-mov span{font-size:11.5px;color:var(--muted)}
.rep-ley{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.rep-ley i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.rep-f{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;line-height:1.5}
.rep .proc-list{display:grid;gap:10px}
.rep .proc-item{border:1px solid var(--line);border-radius:8px;padding:9px 11px;break-inside:avoid}
.rep .proc-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0}
.rep .proc-sig{margin:4px 0 0;font-size:12px;color:var(--muted)}
.rep .proc-cons{margin:5px 0 0;font-size:13px;line-height:1.45;word-break:break-word}
.rep-ia{font-size:12px;font-weight:600;white-space:nowrap}
.rep-ia.esc{color:var(--bad)}
@media (max-width:760px){.rep-kpis{grid-template-columns:repeat(2,1fr)}.rep-2{grid-template-columns:1fr}.rep{padding:16px}}
@media print{

  html,body{background:#fff!important;color:#1E1220}
  .side,.tip,.toast,.solo-pantalla,#ase-fondo{display:none!important}
  .app{display:block!important}
  .main{padding:0!important}
  .rep{border:0;padding:0;max-width:none;font-size:12px}
  .rep-sec,.rep-k{break-inside:avoid}
  .rep-kpis{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:6px;margin-bottom:8px}
  .rep-2{grid-template-columns:3fr 2fr!important;gap:8px;margin-bottom:8px}
  .rep-sec{padding:7px 10px;margin-bottom:8px}

  .rep-h{margin-bottom:8px;padding-bottom:7px}.rep-h h2{font-size:18px}
  .rep svg{max-height:118px}
  .rep .list li{padding-block:1px;min-height:0}
  .rep .stack{height:14px}
  .rep table{font-size:11px}.rep td,.rep th{padding:3px 5px}
  .rep .proc-item{padding:6px 9px}.rep .proc-cons{font-size:11.5px}
  .rep-mov{margin-top:6px}.rep-mov b{font-size:15px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

};

function rng(seed){var s=seed;return function(){s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
var MOCK=(function(){
  var r=rng(7),N=90,pts=[],c=11,a=24,m=41,b=60,HOY=Date.UTC(2026,10,18);
  for(var i=0;i<N;i++){c=Math.max(3,Math.round(c+(r()-.46)*2.6));a=Math.max(8,Math.round(a+(r()-.47)*4));m=Math.max(15,Math.round(m+(r()-.5)*5));b=Math.max(30,Math.round(b+(r()-.5)*3));

  /* Evolucion de la prioridad en cuatro etapas (acordado con el equipo del motor, 24-nov). Reglas: lo oficial, lo sombra,
     lo hipotetico y lo decidido se distinguen; no hay prioridad simulada si la aplicabilidad esta condicionada; el agente
     nunca fija una prioridad; el ejemplo sintetico nunca se presenta como aprobacion real. */
  function etMeta(meta){var r=(meta||[]).filter(function(x){return x[1]!=null&&x[1]!==""}).map(function(x){
      return '<span class="et-mk">'+esc(x[0])+'</span><span class="et-mv">'+esc(x[1])+'</span>'}).join("");
    return r?'<span class="et-m">'+r+'</span>':''}
  function etapa(titulo,valor,est,det,meta,hip){return '<div'+(hip?' class="et-hip"':'')+'><span class="et-t">'+titulo+'</span><span class="et-v">'+valor+'</span>'+
    '<span><span class="pill '+est[1]+'">'+est[0]+'</span></span><span class="et-d">'+det+'</span>'+etMeta(meta)+'</div>'}
  var cond=pd.condicion==="condicionada_a_confirmar_aplicabilidad";
  var corr=a.corrida_id?String(a.corrida_id).slice(0,8):null,fecha=a.generado_en?corta(a.generado_en):null,
      conf=(typeof a.confianza==="number")?Math.round(a.confianza*100)+"%":null,
      base=(m.prioridad_base!=null&&m.piso!=null)?("P"+m.prioridad_base+" → piso P"+m.piso):null;
  var h='<section class="ase-evol" aria-label="Evolución de la prioridad"><div class="ase-et">'+
    etapa("1 · Cruce",pc?'<span class="pill '+pc[1]+'">'+pc[0]+'</span>':'—',["Oficial","st-ok"],"Prioridad vigente en el panel.",
      [["Fuente","Cruce determinista · RDS"],["Estado",ESTADO[fila.estado]||fila.estado]])+
    etapa("2 · Motor contextual",pm?'<span class="pill '+pm[1]+'">P'+m.prioridad_final+' · '+pm[0]+'</span>':'—',["Sombra","st-warn"],
      "Referencia "+esc(m.version||"")+(m.tipo==="investigacion"?"; de investigación":"")+". No reemplaza la oficial.",
      [["Fuente","Motor contextual · S3"],["Fecha",fecha],["Corrida",corr],["Reglas",m.version],["Base",base],["Aplicabilidad",m.aplicabilidad]])+
    etapa("3 · Con la valoración del agente",'<span class="ase-m">'+(cond?"No se calcula":"Sin escenario calculado")+'</span>',
      cond?["Condicionado","st-warn"]:["Sin escenario","st-off"],
      (cond?"Primero hay que confirmar que la vulnerabilidad aplica. ":"")+"Propuesta: P "+esc(pd.probabilidad==null?"—":pd.probabilidad)+" × I "+esc(pd.impacto==null?"—":pd.impacto)+"; no vinculante.",
      [["Fuente","Bedrock a2 + guard v2.1"],["Fecha",fecha],["Corrida",corr],["Modelo",a.modelo],["Confianza",conf]],true)+
    etapa("4 · Decisión del dueño",'<span class="ase-m">—</span>',["Pendiente","st-off"],"La prioridad oficial solo cambia con una aprobación autenticada y el recálculo del motor.",
      [["Fuente","Flujo de decisión (HITL)"],["Estado","Pendiente"]])+
    '</div>'+
    (m.tipo==="investigacion"?'<p class="ase-nota">Prioridad de <b>investigación</b>: primero hay que confirmar que la vulnerabilidad aplica; después, remediar.</p>':'')+
    (pc&&pm&&fila.prioridad_final!==m.prioridad_final?'<p class="ase-nota">El cruce y el motor difieren porque el motor contextual aún funciona en modo sombra: su valor es una referencia y no reemplaza la prioridad del panel.</p>':'')+
    '<details class="ase-demo"><summary>Ejemplo sintético: cómo cambiaría la prioridad tras una aprobación</summary>'+
    '<p><b>No es un hallazgo real ni una aprobación real.</b> En un caso de laboratorio del equipo del motor, el motor calcula P4 (riesgo residual 2/9). '+
    'Si el dueño aprobara una valoración P = 2 e I = 3, el motor recalcularía <b>P2</b> (riesgo residual 6/9). La prioridad la calcula siempre el motor, nunca el agente.</p></details>'+
    '</section>';
  h+=aseSec("Por qué tiene esta prioridad",a.explicacion?'<p>'+esc(a.explicacion)+'</p>':'');
  h+=aseSec("Recomendación de urgencia",'<p><b>'+esc(ASE_REC[r.efectiva]||r.efectiva||"—")+'</b>'+
    (r.propuesta&&r.propuesta!==r.efectiva?' <span class="chip">el modelo propuso: '+esc(ASE_REC[r.propuesta]||r.propuesta)+'</span>':'')+'</p>'+
    (r.justificacion?'<p class="ase-m">'+esc(r.justificacion)+'</p>':''));
  h+=aseSec("Escenario de riesgo",(es.amenaza?'<p><b>Amenaza.</b> '+esc(es.amenaza)+'</p>':'')+(es.vector?'<p><b>Vector.</b> '+esc(es.vector)+'</p>':'')+
    (es.proceso?'<p><b>Proceso afectado.</b> '+esc(es.proceso)+'</p>':'')+(es.consecuencia?'<p><b>Consecuencia.</b> '+esc(es.consecuencia)+'</p>':'')+
    ((es.tecnicas||[]).length?'<p>'+es.tecnicas.map(function(t){return '<span class="chip mono">'+esc(t)+'</span>'}).join(" ")+'</p>':''));
  h+=aseSec("Plan de acción propuesto",aseLista(a.plan,function(p){return '<li><span class="chip">'+esc(ASE_TIPO[p.tipo]||p.tipo||"")+'</span> '+esc(p.descripcion)+'</li>'},"ol"));
  h+=aseSec("Mitigación temporal",a.mitigacion_temporal?'<p>'+esc(a.mitigacion_temporal)+'</p>':'');
  h+=aseSec("Controles sugeridos",aseLista(a.controles,function(x){return '<li><span class="chip">'+esc(ASE_TIPO[x.tipo]||x.tipo||"")+'</span> '+esc(x.descripcion)+'</li>'}));
  h+=aseSec("Datos por verificar",aseLista(a.datos_a_verificar,function(x){return '<li><span class="mono">'+esc(x.ruta_campo)+'</span>: '+esc(x.motivo)+'</li>'}));
  h+=aseSec("Observaciones para la revisión",aseLista(a.observaciones,function(x){return '<li><span class="mono">'+esc(x.ruta_campo)+'</span>: '+esc(x.observacion)+'</li>'}));
  h+=aseSec("Propuesta para el dueño",'<p>Probabilidad <b>'+esc(pd.probabilidad==null?"—":pd.probabilidad)+'</b> × impacto <b>'+esc(pd.impacto==null?"—":pd.impacto)+'</b> (escala de 1 a 3)</p>'+
    '<p class="ase-m">'+esc(pd.estado==="pendiente_aprobacion_dueno"?"Pendiente de aprobación del dueño":(pd.estado||""))+
    (pd.condicion==="condicionada_a_confirmar_aplicabilidad"?". Condicionada a confirmar que la vulnerabilidad aplica.":"")+'</p>');
  h+=aseSec("Revisión humana",(rv.requerida?'<p><span class="pill '+(rv.prioridad==="alta"?"st-bad":"st-warn")+'">Requerida · '+esc(rv.prioridad||"")+'</span></p>':'<p>No requerida</p>')+
    aseLista(rv.motivos,function(x){return '<li>'+esc(ASE_MOT[x]||x)+'</li>'}));
  h+='<footer class="ase-pie">'+(cx.aprobado?'':'<span class="chip">Modelo de negocio en borrador · '+esc(cx.version||"")+'</span>')+
    (a.vigente===false?'<span class="chip">De una corrida anterior</span>':'')+
    '<span>Modelo '+esc(a.modelo||"—")+(typeof a.confianza==="number"?' · confianza '+Math.round(a.confianza*100)+' %':'')+
    ' · corrida '+esc(String(a.corrida_id||"").slice(0,8))+(a.generado_en?' · '+esc(hace(a.generado_en)):'')+'</span></footer>';
  return h;
}

var REP_IA={escalar:["IA: escalar","esc"],mantener:["IA: mantener",""],revisar_a_la_baja:["IA: revisar a la baja",""]};

function repDelta(n,menosEsMejor){if(n==null)return '<small>sin comparación aún</small>';if(n===0)return '<small>= vs. semana anterior</small>';
  var malo=menosEsMejor?n>0:n<0;return '<small style="color:var('+(malo?'--bad':'--ok')+')">'+(n>0?'+':'')+n+' vs. semana anterior</small>'}

function repTendencia(serie){

    [["criticas",1],["altas",2],["medias",3],["bajas",4]].forEach(function(k){var v=+d[k[0]]||0,h=v/max*(H-30);if(h>0){y-=h;out+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-4).toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+PRIO[k[1]][2]+'"/>'}});
    if(i%2===0||i===serie.length-1)out+='<text x="'+(x+(bw-4)/2).toFixed(1)+'" y="'+(H-4)+'" font-size="9" text-anchor="middle" fill="currentColor" opacity=".7">'+esc(repFecha(d.dia).split(" ").slice(0,2).join(" "))+'</text>';
    return out}).join("");
  var tot=serie[serie.length-1],tt=(+tot.criticas||0)+(+tot.altas||0)+(+tot.medias||0)+(+tot.bajas||0);
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Hallazgos abiertos por prioridad en los últimos '+serie.length+' días; hoy '+tt+'">'+
    '<text x="0" y="10" font-size="9" fill="currentColor" opacity=".7">'+max+'</text><line x1="'+pad+'" x2="'+W+'" y1="'+(H-18)+'" y2="'+(H-18)+'" stroke="currentColor" opacity=".25"/>'+barras+'</svg>'+
    '<div class="rep-ley">'+[1,2,3,4].map(function(p){return '<span><i style="background:'+PRIO[p][2]+'"></i>'+PRIO[p][0]+'</span>'}).join("")+'</div>'}

        return '<tr><td class="mono"><b>'+esc(x.cve)+'</b>'+(x.kev?' <span class="venc">KEV</span>':'')+(x.internet?' <span style="color:var(--muted)">· internet</span>':'')+'</td><td>'+repPill(x.prioridad)+'</td><td class="n">'+repPlazo(x.dias,x.fecha_limite)+'</td><td>'+esc((x.activos||[]).join(", "))+esc(extra)+'</td><td>'+repIA(x.ia)+'</td></tr>'}).join("")+'</tbody></table>'
    :'<p class="empty">No hay vulnerabilidades abiertas.</p>';
  var rc=a.recomendaciones||{};
  return '<header class="rep-h"><div><b>Lyft · Threat Intelligence</b><h2>Resumen semanal</h2><p>Semana '+esc(per.semana||"")+' · del '+esc(repFecha(per.desde))+' al '+esc(repFecha(per.hasta))+'</p></div><div class="rep-conf">CONFIDENCIAL<br>Uso interno · no distribuir</div></header>'+
    '<section class="rep-kpis" aria-label="Indicadores clave">'+
      '<div class="rep-k"><span>Hallazgos abiertos</span><b>'+tot+'</b>'+repDelta(P.cambio_abiertos,true)+'</div>'+

      '<div class="rep-k'+(k.cves?' mal':'')+'"><span>Explotación activa (CISA KEV)</span><b>'+(+k.cves||0)+'</b><small>CVE · '+(+k.produccion||0)+' en producción</small></div>'+
    '</section>'+
    '<div class="rep-2"><section class="rep-sec"><h3>Tendencia de hallazgos abiertos (14 días)</h3>'+repTendencia(r.serie)+'</section>'+

    '<section class="rep-sec"><h3>Riesgo por proceso de negocio <span class="chip">Análisis del agente de IA · no vinculante</span></h3>'+procesos+'</section>'+
    '<section class="rep-sec"><h3>Vulnerabilidades más urgentes</h3>'+top+'</section>'+

      (a.disponible?'Esta semana el agente asesoró <b>'+(+a.casos_semana||0)+'</b> casos (recomendaciones vigentes: escalar '+(+rc.escalar||0)+' · mantener '+(+rc.mantener||0)+' · revisar a la baja '+(+rc.revisar_a_la_baja||0)+'), con un costo estimado de <b>USD '+(a.costo_estimado_usd==null?'—':Number(a.costo_estimado_usd).toFixed(2))+'</b>. ':'')+

function spark(vals){
  if(!vals||vals.length<2)return "";
  var w=84,h=26,mn=Math.min.apply(0,vals),mx=Math.max.apply(0,vals),p=3;
  var pts=vals.map(function(v,i){return [p+i*(w-2*p)/(vals.length-1),h-p-(v-mn)/(mx-mn||1)*(h-2*p)]});
  var l=pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="'+pts.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1)}).join(" ")+'"/><circle cx="'+l[0]+'" cy="'+l[1]+'" r="3.2" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/></svg>';
}
function niceMax(v){if(v<=0)return 5;var p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function drawLines(host,series,labels){
  var n=labels.length,W=Math.max(280,host.clientWidth),H=Math.min(250,Math.max(190,W*.38)),L=34,R=12,T=10,B=24;
  var mx=niceMax(Math.max.apply(0,series.map(function(s){return Math.max.apply(0,s.v)}))*1.05);
  function X(i){return L+i*(W-L-R)/(n-1)}function Y(v){return T+(1-v/mx)*(H-T-B)}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Hallazgos abiertos por prioridad, '+n+' días">';
  for(var g=0;g<=4;g++){var gv=mx*g/4,gy=Y(gv);s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'"/><g class="axis"><text x="'+(L-8)+'" y="'+(gy+4)+'" text-anchor="end">'+Math.round(gv)+'</text></g>'}
  var ticks=Math.min(n,W<420?3:5);
  for(var k=0;k<ticks;k++){var ix=Math.round(k*(n-1)/(ticks-1));s+='<g class="axis"><text x="'+X(ix)+'" y="'+(H-6)+'" text-anchor="'+(k===0?"start":k===ticks-1?"end":"middle")+'">'+corta(labels[ix])+'</text></g>'}
  series.forEach(function(se){
    s+='<polyline fill="none" stroke="'+se.c+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+se.v.map(function(v,i){return X(i).toFixed(1)+","+Y(v).toFixed(1)}).join(" ")+'"/>';
    s+='<circle cx="'+X(n-1)+'" cy="'+Y(se.v[n-1])+'" r="4" fill="'+se.c+'" stroke="var(--panel)" stroke-width="2"/>';
  });
  s+='<line id="xh" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>';
  series.forEach(function(se,i){s+='<circle id="hc'+i+'" r="4.5" fill="'+se.c+'" stroke="var(--panel)" stroke-width="2" style="display:none"/>'});
  s+='<rect x="'+L+'" y="'+T+'" width="'+(W-L-R)+'" height="'+(H-T-B)+'" fill="transparent" id="hit"/></svg>';
  host.innerHTML=s;host.classList.add("hov");
  var svg=host.querySelector("svg"),hit=svg.querySelector("#hit"),xh=svg.querySelector("#xh");
  function mv(e){
    var r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,i=Math.round((px-L)/(W-L-R)*(n-1));i=Math.max(0,Math.min(n-1,i));
    xh.setAttribute("x1",X(i));xh.setAttribute("x2",X(i));xh.style.display="";
    series.forEach(function(se,j){var c=svg.querySelector("#hc"+j);c.setAttribute("cx",X(i));c.setAttribute("cy",Y(se.v[i]));c.style.display=""});
    showTip("<b>"+corta(labels[i])+"</b>"+series.map(function(se){return se.n+": "+se.v[i]}).join("<br>"),e.clientX,e.clientY);
  }
  hit.addEventListener("pointermove",mv);
  hit.addEventListener("pointerleave",function(){xh.style.display="none";svg.querySelectorAll("circle[id^=hc]").forEach(function(c){c.style.display="none"});hideTip()});
}

    el.innerHTML='<div class="tools">'+
      '<button class="grab" title="Arrastrar" aria-label="Arrastrar '+d.t+'">'+IC.grip+'</button>'+
      '<button data-a="prev" title="Mover antes" aria-label="Mover antes">'+IC.left+'</button><button data-a="next" title="Mover después" aria-label="Mover después">'+IC.right+'</button>'+
      '<button data-a="min" title="Más angosto" aria-label="Más angosto">'+IC.minus+'</button><button data-a="mas" title="Más ancho" aria-label="Más ancho">'+IC.plus+'</button>'+
      '<button data-a="hide" title="Quitar" aria-label="Quitar">'+IC.eyeoff+'</button></div>'+head+'<div class="wbody"><p class="empty" style="padding:14px 0">Cargando…</p></div>';
    if(editando){
      el.draggable=true;
      el.addEventListener("dragstart",function(e){dragId=x.id;el.classList.add("dragging");try{e.dataTransfer.setData("text/plain",x.id);e.dataTransfer.effectAllowed="move"}catch(_){}});

    if(sub)sub.textContent="Hallazgos que cruzan las fuentes con el inventario de Lyft."+(e&&e.items&&e.items[0]?" Último flujo: "+hace(e.items[0].inicio)+".":"");
  });
}
var corridaN=0;
function mover(id,antes){
  var i=S.layout.map(function(x){return x.id}).indexOf(id),it=S.layout.splice(i,1)[0],j=S.layout.findIndex(function(x){return x.id===antes});
  S.layout.splice(j,0,it);save();viewPanel();
}
function acc(id,a){
  var vis=S.layout.filter(function(x){return x.on}),x=S.layout.filter(function(q){return q.id===id})[0],sp=WIDGETS[id].spans,k=sp.indexOf(x.span);
  if(a==="hide"){x.on=false}
  else if(a==="min"&&k>0){x.span=sp[k-1]}
  else if(a==="mas"&&k<sp.length-1){x.span=sp[k+1]}
  else if(a==="prev"||a==="next"){var vi=vis.indexOf(x),o=vis[vi+(a==="prev"?-1:1)];if(!o)return;
    var i=S.layout.indexOf(x),j=S.layout.indexOf(o);S.layout[i]=o;S.layout[j]=x}
  save();viewPanel();
}

function expr(f){return {"1h":"rate(1 hour)","6h":"rate(6 hours)","12h":"rate(12 hours)","24h":"cron(MIN "+f.hora+" * * ? *)","7d":"cron(MIN "+f.hora+" ? * "+f.dow+" *)"}[f.freq]}

  main.innerHTML='<div class="top"><div><h1>Configuración</h1></div></div><p class="empty">Cargando…</p>';
  api("sistema/configuracion").then(function(c){

  },function(e){main.innerHTML='<div class="top"><div><h1>Configuración</h1></div></div><p class="empty">'+esc(e.message)+'<br><button class="btn sm" style="margin-top:10px" id="rc">Reintentar</button></p>';$("#rc").addEventListener("click",viewConfig)});

function campo(id,tipo,etq,icono,auto,extra){
  return '<label class="lg-f"><span class="vh">'+etq+'</span><span class="lg-i">'+icono+'</span><input id="'+id+'" type="'+tipo+'" placeholder="'+etq+'" autocomplete="'+auto+'" required '+(extra||"")+'>'+

}
function cajaAcceso(titulo,sub,cuerpo){
  document.body.classList.add("sinsesion");
  main.innerHTML='<div class="lg-wrap"><div class="lg-card"><div class="lg-logo" aria-hidden="true">'+IC.shield+'</div><h1>'+titulo+'</h1><p class="lg-sub">'+sub+'</p>'+cuerpo+'</div>'+
    '<p class="lg-pie">Acceso solo para personal autorizado de Lyft.</p></div>';
  main.querySelectorAll("[data-ver]").forEach(function(b){b.addEventListener("click",function(){
    var i=$("#"+b.dataset.ver),ver=i.type==="password";i.type=ver?"text":"password";b.setAttribute("aria-label",ver?"Ocultar contraseña":"Mostrar contraseña")})});
}
function aviso(txt,ok){var e=$("#av");e.className=ok?"ok":"aviso";e.textContent=txt;e.hidden=!txt}
function viewLogin(){
  cajaAcceso("Iniciar sesión","Threat Intelligence · Lyft",
    '<form id="lf" class="lg-form">'+campo("lu","text","Usuario o correo",IC.user,"username")+campo("lp","password","Contraseña",IC.lock,"current-password")+
    '<p id="av" class="aviso" role="alert" hidden></p><button class="lg-go" type="submit" id="lb">Entrar</button>'+
    '<button type="button" class="lg-link" id="olv">¿Olvidaste tu contraseña?</button></form>');
  $("#olv").addEventListener("click",viewOlvido);
  $("#lf").addEventListener("submit",function(ev){
    ev.preventDefault();aviso("");var bt=$("#lb");bt.disabled=true;
    var u=$("#lu").value.trim(),p=$("#lp").value;
    cognito("InitiateAuth",{AuthFlow:"USER_PASSWORD_AUTH",ClientId:CFG.clientId,AuthParameters:{USERNAME:u,PASSWORD:p}}).then(function(j){
      return tras(j,u);
    }).catch(function(e){bt.disabled=false;aviso(/NotAuthorized|UserNotFound/.test(e.tipo||"")?"Usuario o contraseña incorrectos.":"No se pudo iniciar sesión. Intenta de nuevo.")});
  });
}
function nuevaClave(usuario,sesion){
  cajaAcceso("Elige tu contraseña","Es tu primer ingreso. Usa al menos 10 caracteres, con mayúsculas, minúsculas y números.",
    '<form id="nf" class="lg-form">'+campo("n1","password","Contraseña nueva",IC.lock,"new-password",'minlength="10"')+campo("n2","password","Repite la contraseña",IC.lock,"new-password",'minlength="10"')+
    '<p id="av" class="aviso" role="alert" hidden></p><button class="lg-go" type="submit" id="nb">Guardar y entrar</button></form>');
  $("#nf").addEventListener("submit",function(ev){
    ev.preventDefault();aviso("");
    if($("#n1").value!==$("#n2").value){aviso("Las contraseñas no coinciden.");return}
    var bt=$("#nb");bt.disabled=true;
    cognito("RespondToAuthChallenge",{ChallengeName:"NEW_PASSWORD_REQUIRED",ClientId:CFG.clientId,Session:sesion,ChallengeResponses:{USERNAME:usuario,NEW_PASSWORD:$("#n1").value}})
    .then(function(j){return tras(j,usuario)})
    .catch(function(e){bt.disabled=false;aviso(/InvalidPassword/.test(e.tipo||"")?"La contraseña no cumple los requisitos.":"No se pudo guardar. Intenta de nuevo.")});
  });
}

        if(/CodeMismatch|EnableSoftwareTokenMFA/.test(e.tipo||""))aviso("El código no es correcto. Revisa que la hora del teléfono esté sincronizada.");
        else if(sesionVencida(e)){viewLogin();aviso("La sesión venció. Vuelve a iniciar sesión.")}
        else aviso("No se pudo verificar. Intenta de nuevo.")});
    });
  },function(){viewLogin();aviso("No se pudo iniciar la verificación en dos pasos. Intenta de nuevo.")});
}
function codigoMfa(usuario,sesion){
  cajaAcceso("Verificación en dos pasos","Escribe el código de 6 dígitos de tu aplicación autenticadora.",
    '<form id="tf" class="lg-form">'+campo("t1","text","Código de 6 dígitos",IC.key,"one-time-code",'inputmode="numeric" pattern="[0-9]{6}" maxlength="6"')+
    '<p id="av" class="aviso" role="alert" hidden></p><button class="lg-go" type="submit" id="tb">Entrar</button>'+
    '<button type="button" class="lg-link" id="vl">Volver a iniciar sesión</button></form>');
  $("#vl").addEventListener("click",viewLogin);
  $("#tf").addEventListener("submit",function(ev){
    ev.preventDefault();aviso("");var bt=$("#tb");bt.disabled=true;
    cognito("RespondToAuthChallenge",{ChallengeName:"SOFTWARE_TOKEN_MFA",ClientId:CFG.clientId,Session:sesion,ChallengeResponses:{USERNAME:usuario,SOFTWARE_TOKEN_MFA_CODE:$("#t1").value.trim()}})
    .then(function(j){return tras(j,usuario)})
    .catch(function(e){bt.disabled=false;
      if(/CodeMismatch/.test(e.tipo||""))aviso("El código no es correcto.");
      else if(sesionVencida(e)){viewLogin();aviso("La sesión venció o hubo demasiados intentos. Vuelve a iniciar sesión.")}
      else aviso("No se pudo verificar. Intenta de nuevo.")});
  });
}
function viewOlvido(){
  cajaAcceso("Recuperar acceso","Te enviamos un código al correo de tu cuenta.",
    '<form id="of" class="lg-form">'+campo("ou","text","Usuario o correo",IC.user,"username")+
    '<p id="av" class="aviso" role="alert" hidden></p><button class="lg-go" type="submit" id="ob">Enviar código</button>'+
    '<button type="button" class="lg-link" id="vl">Volver a iniciar sesión</button></form>');
  $("#vl").addEventListener("click",viewLogin);
  $("#of").addEventListener("submit",function(ev){
    ev.preventDefault();aviso("");var bt=$("#ob"),u=$("#ou").value.trim();bt.disabled=true;
    cognito("ForgotPassword",{ClientId:CFG.clientId,Username:u}).then(function(){codigo(u)},function(e){
      bt.disabled=false;aviso(/LimitExceeded|TooMany/.test(e.tipo||"")?"Demasiados intentos. Espera unos minutos.":"No se pudo enviar el código. Revisa el usuario o pide ayuda a un administrador.")});
  });
}
function codigo(usuario){
  cajaAcceso("Revisa tu correo","Escribe el código que te enviamos y elige una contraseña nueva.",
    '<form id="cf" class="lg-form">'+campo("cc","text","Código de 6 dígitos",IC.key,"one-time-code",'inputmode="numeric"')+campo("c1","password","Contraseña nueva",IC.lock,"new-password",'minlength="10"')+
    '<p id="av" class="aviso" role="alert" hidden></p><button class="lg-go" type="submit" id="cb">Cambiar contraseña</button>'+
    '<button type="button" class="lg-link" id="vl">Volver a iniciar sesión</button></form>');
  $("#vl").addEventListener("click",viewLogin);
  $("#cf").addEventListener("submit",function(ev){
    ev.preventDefault();aviso("");var bt=$("#cb");bt.disabled=true;
    cognito("ConfirmForgotPassword",{ClientId:CFG.clientId,Username:usuario,ConfirmationCode:$("#cc").value.trim(),Password:$("#c1").value}).then(function(){
      viewLogin();aviso("Contraseña actualizada. Ya puedes entrar.",true)
    },function(e){bt.disabled=false;
      aviso(/CodeMismatch|ExpiredCode/.test(e.tipo||"")?"El código no es correcto o ya venció.":/InvalidPassword/.test(e.tipo||"")?"La contraseña debe tener 10 caracteres o más, con mayúsculas, minúsculas y números.":"No se pudo cambiar la contraseña. Intenta de nuevo.")});
  });
}
function entrar(){document.body.classList.remove("sinsesion");location.hash="#panel";route()}

/* ---------- rutas ---------- */
function route(){
  hideTip();ro.disconnect();
  var h=location.hash.replace("#","")||"panel";
  if(!CFG&&!DEMO){document.body.classList.remove("sinsesion");
    main.innerHTML='<div class="top"><div><h1>Sin configuración</h1><p>No se encontró <code>config.js</code> con <code>window.LTI_CONFIG</code>. Para usar datos de ejemplo añade <code>?demo</code> a la URL.</p></div></div>';return}
  $("#nav-panel").removeAttribute("aria-current");$("#nav-conf").removeAttribute("aria-current");$("#nav-rep").removeAttribute("aria-current");
  var nb=$("#nav-band");if(nb)nb.removeAttribute("aria-current");
  var nt=$("#nav-tran");if(nt)nt.removeAttribute("aria-current");
  var nu=$("#nav-usr");if(nu)nu.removeAttribute("aria-current");
  if(!DEMO&&(!AUTH||!AUTH.id)){pintaUsuario();return viewLogin()}
  document.body.classList.remove("sinsesion");pintaUsuario();
  var nu2=$("#nav-usr");if(nu2)nu2.style.display=esAdmin()?"":"none";
  if(h==="reporte"){$("#nav-rep").setAttribute("aria-current","page");editando=false;viewReporte()}
  else if(h==="bandeja"){if(nb)nb.setAttribute("aria-current","page");editando=false;viewBandeja()}
  else if(h==="transiciones"){if(nt)nt.setAttribute("aria-current","page");editando=false;viewTransiciones()}
  else if(h==="configuracion"){$("#nav-conf").setAttribute("aria-current","page");editando=false;viewConfig()}
  else if(h==="usuarios"){if(nu2)nu2.setAttribute("aria-current","page");editando=false;viewUsuarios()}
  else{$("#nav-panel").setAttribute("aria-current","page");viewPanel()}
}
window.addEventListener("hashchange",route);route();
setInterval(function(){if(!editando&&!document.hidden&&$("#grid")){cache={};viewPanel()}},300000);
})();

</script>

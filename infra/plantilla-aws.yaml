AWSTemplateFormatVersion: "2010-09-09"
Description: Prototipo LTI (Camino B) - componentes de bajo costo. Los componentes de produccion (Network Firewall, EKS, MSK, Aurora, NAT, Neptune, Redshift) se documentan y no se crean.

Parameters:
  EmailPresupuesto:
    Type: String
    Description: Correo que recibe las alertas de presupuesto
  NombreProyecto:
    Type: String
    Default: lti
    AllowedPattern: "[a-z0-9-]{1,12}"
  VersionNucleo:
    Type: String
    Default: v7
    AllowedPattern: "[a-z0-9.-]{1,20}"
    Description: Version del paquete lti-nucleo-<version>.zip en s3://<bucket curada>/artefactos/. Cambiala cada vez que subas un paquete nuevo.
  ArnSlack:
    Type: String
    # O-10 (24-nov): sin valor por defecto (el repositorio es publico); desplegar.sh reutiliza el valor del stack.
    AllowedPattern: "arn:aws:lambda:[a-z0-9-]+:[0-9]{12}:function:[A-Za-z0-9_-]+"
    Description: Emisor de Slack v2 (lti-notificador-slack, fuera del stack). Recibe {"mensajes":[{ids,title,body}]}.
  EmailAdminPanel:
    Type: String
    AllowedPattern: "[^@ ]+@[^@ ]+\\.[^@ ]+"
    Description: Correo de la primera persona administradora del panel. Cognito le envia ahi su contrasena temporal.
  ClaveNeo4j:
    Type: String
    NoEcho: true
    AllowedPattern: "[A-Za-z0-9]{8,64}"
    Description: Contrasena del usuario neo4j de la CMDB. Solo letras y numeros, minimo 8.
  ImagenLinuxArm:
    Type: AWS::EC2::Image::Id
    Description: >-
      AMI de la CMDB. desplegar.sh pasa la de la instancia que ya corre. Antes era el parametro SSM
      "latest" de Amazon Linux 2023, que cambia solo cuando AWS publica una imagen nueva y provocaba el
      REEMPLAZO de la instancia (y la perdida de Neo4j) en cualquier despliegue.
  VersionAgente:
    Type: String
    Default: a2-1   # O-3: reutilizacion de asesorias
    AllowedPattern: "[a-z0-9.-]{1,20}"
    Description: Version del paquete lti-agente-<version>.zip en s3://<bucket curada>/artefactos/ (agente asesor).
  ModoDemoAgente:
    Type: String
    # 24-nov: produccion. Con la corrida f332e8ef, true y false dan los mismos 10 casos asesorables.
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: true envia los casos al agente (demostracion); false aplica la politica de enrutamiento (P1/P2, KEV, ambiguos).
Resources:
  # --- Red privada minima para RDS (sin NAT Gateway: nada en esta VPC necesita salir a internet) ---
  VpcRDS:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.50.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcRDS
      CidrBlock: 10.50.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcRDS
      CidrBlock: 10.50.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  TablaRutas:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcRDS

  AsociarRutaA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref TablaRutas

  AsociarRutaB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref TablaRutas

  IGW:
    Type: AWS::EC2::InternetGateway

  AdjuntarIGW:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VpcRDS
      InternetGatewayId: !Ref IGW

  RutaPublica:
    Type: AWS::EC2::Route
    DependsOn: AdjuntarIGW
    Properties:
      RouteTableId: !Ref TablaRutas
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW

  # Endpoint de S3 (gratis): permite que las Lambdas en la VPC lean/escriban S3
  # sin necesitar NAT Gateway ni salida a internet.
  EndpointS3:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcRDS
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds:
        - !Ref TablaRutas
      VpcEndpointType: Gateway

  GrupoSubredesRDS:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subredes privadas para RDS
      SubnetIds:
        - !Ref SubnetA
        - !Ref SubnetB

  SgRDS:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Solo acepta Postgres desde las Lambdas de normalizacion y cruce
      VpcId: !Ref VpcRDS

  SgLambdaRDS:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambdas que necesitan hablar con RDS
      VpcId: !Ref VpcRDS

  ReglaRDSDesdeLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SgRDS
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      Description: "Lambdas de la VPC (SgLambdaRDS)"
      SourceSecurityGroupId: !Ref SgLambdaRDS

  # F-3 (22-nov): se retira ReglaRDSDesdeMiIP. La administracion entra por SSM (tunel via InstanciaCMDB).

  ReglaRDSDesdeCMDB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SgRDS
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      Description: "CMDB Neo4j/Cartography (SgCMDB)"
      SourceSecurityGroupId: !Ref SgCMDB

  BaseDatosRDS:
    Type: AWS::RDS::DBInstance
    # Snapshot: si alguien borra el stack, la base no desaparece sin respaldo.
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Tags:
        - Key: activo
          Value: aurora-lti
      DBInstanceIdentifier: !Sub "${NombreProyecto}-rds"
      Engine: postgres
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageType: gp2
      MasterUsername: lti_app
      # 2B / SEC-03 (23-nov): RDS genera y rota la clave maestra en Secrets Manager (rds!db-...).
      ManageMasterUserPassword: true
      DBName: lti
      DBSubnetGroupName: !Ref GrupoSubredesRDS
      VPCSecurityGroups:
        - !Ref SgRDS
      PubliclyAccessible: false   # F-1 (22-nov): sin IP publica; solo clientes de la VPC
      MultiAZ: false
      # Cambios aplicados SIN reemplazo ni reinicio (verificar en el change set que Replacement = False):
      EnableIAMDatabaseAuthentication: true   # ya activo desde el 19-nov (R3): formaliza la deriva
      # Se mantiene en 1: el plan gratuito de la cuenta no admite mas (FreeTierRestrictionError, 23-nov).
      # Compensacion: FuncionRespaldoDiario (instantanea diaria con rotacion de 7 dias).
      BackupRetentionPeriod: 1
      DeletionProtection: true
      # NO agregar StorageEncrypted aqui: cambiarlo REEMPLAZA la instancia (base nueva y vacia).
      # El cifrado en reposo se hace despues de la demo con instantanea cifrada + restauracion.

  BucketRaw:
    Type: AWS::S3::Bucket
    Properties:
      Tags:
        - Key: activo
          Value: s3-raw-lti
      BucketName: !Sub "${NombreProyecto}-raw-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expirar-raw-90-dias
            Status: Enabled
            ExpirationInDays: 90

  BucketCurada:
    Type: AWS::S3::Bucket
    Properties:
      Tags:
        - Key: activo
          Value: s3-curada-lti
      BucketName: !Sub "${NombreProyecto}-curada-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SecretoNVD:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${NombreProyecto}/nvd"
      Description: Clave gratuita de la API de NVD. Reemplazar PENDIENTE con la clave real.
      SecretString: '{"api_key":"PENDIENTE"}'

  SecretoSlack:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${NombreProyecto}/slack"
      Description: URL del webhook de Slack del canal de alertas. Reemplazar PENDIENTE.
      SecretString: '{"webhook_url":"PENDIENTE"}'

  RolConector:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: minimo-privilegio
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${BucketRaw.Arn}/raw/*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SecretoNVD

  FuncionConector:
    Type: AWS::Lambda::Function
    Properties:
      Tags:
        - Key: activo
          Value: lti-conector-api
      FunctionName: !Sub "${NombreProyecto}-conector-nvd-kev"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt RolConector.Arn
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          RAW_BUCKET: !Ref BucketRaw
          NVD_SECRET: !Ref SecretoNVD
      Code:
        ZipFile: |
          import json, os, time, datetime, urllib.request, urllib.parse, boto3
          s3 = boto3.client("s3")
          sm = boto3.client("secretsmanager")
          BUCKET = os.environ["RAW_BUCKET"]
          SECRETO = os.environ["NVD_SECRET"]
          KEV_URL = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
          def get(url, headers=None):
              for intento in range(4):
                  try:
                      req = urllib.request.Request(url, headers=headers or {"User-Agent": "lti-prototipo"})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return r.read()
                  except urllib.error.HTTPError as e:
                      if e.code in (403, 429) and intento < 3:
                          time.sleep(8 * (intento + 1)); continue
                      raise
          def handler(event, context):
              ahora = datetime.datetime.now(datetime.timezone.utc)
              desde = ahora - datetime.timedelta(hours=26)
              clave = json.loads(sm.get_secret_value(SecretId=SECRETO)["SecretString"]).get("api_key", "")
              hdr = {"User-Agent": "lti-prototipo"}
              if clave and clave != "PENDIENTE":
                  hdr["apiKey"] = clave
              fmt = "%Y-%m-%dT%H:%M:%S.000+00:00"
              cves, inicio, total = [], 0, None
              while total is None or inicio < total:
                  q = urllib.parse.urlencode({"lastModStartDate": desde.strftime(fmt),
                                              "lastModEndDate": ahora.strftime(fmt),
                                              "startIndex": inicio, "resultsPerPage": 2000})
                  datos = json.loads(get("https://services.nvd.nist.gov/rest/json/cves/2.0?" + q, hdr))
                  total = datos.get("totalResults", 0)
                  cves += [v["cve"] for v in datos.get("vulnerabilities", [])]
                  inicio += 2000
                  time.sleep(1 if clave else 6)
              tag = ahora.strftime("%Y/%m/%d/%H%M%S")
              s3.put_object(Bucket=BUCKET, Key=f"raw/nvd/{tag}.json",
                            Body=json.dumps({"descargado": ahora.isoformat(), "cves": cves}).encode(),
                            ContentType="application/json")
              kev = get(KEV_URL)
              s3.put_object(Bucket=BUCKET, Key=f"raw/kev/{tag}.json", Body=kev, ContentType="application/json")
              return {"cves_nvd": len(cves), "kev_bytes": len(kev), "raw": tag}

  FuncionEPSS:
    Type: AWS::Lambda::Function
    Properties:
      Tags:
        - Key: activo
          Value: lti-conector-api
      FunctionName: !Sub "${NombreProyecto}-conector-epss"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt RolConector.Arn
      Timeout: 240
      MemorySize: 512
      Environment:
        Variables:
          RAW_BUCKET: !Ref BucketRaw
      Code:
        ZipFile: |
          import gzip, json, csv, os, datetime, urllib.request, boto3
          s3 = boto3.client("s3")
          BUCKET = os.environ["RAW_BUCKET"]
          URL = "https://epss.cyentia.com/epss_scores-current.csv.gz"
          def handler(event, context):
              req = urllib.request.Request(URL, headers={"User-Agent": "lti-prototipo"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  crudo = r.read()
              texto = gzip.decompress(crudo).decode("utf-8")
              del crudo
              lineas = (l for l in texto.splitlines() if l and not l.startswith("#"))
              lector = csv.DictReader(lineas)
              partes, total = [], 0
              for f in lector:
                  partes.append(f'{{"cve":"{f["cve"]}","epss":{float(f["epss"])},"percentil":{float(f["percentile"])}}}')
                  total += 1
              cuerpo = '{"descargado":"%s","puntajes":[%s]}' % (
                  datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  ",".join(partes),
              )
              ahora = datetime.datetime.now(datetime.timezone.utc)
              tag = ahora.strftime("%Y/%m/%d/%H%M%S")
              s3.put_object(Bucket=BUCKET, Key=f"raw/epss/{tag}.json", Body=cuerpo.encode(), ContentType="application/json")
              return {"cves_epss": total, "raw": tag}

  FuncionOSV:
    Type: AWS::Lambda::Function
    Properties:
      Tags:
        - Key: activo
          Value: lti-conector-api
      FunctionName: !Sub "${NombreProyecto}-conector-osv-ghsa"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt RolConector.Arn
      Timeout: 180
      MemorySize: 256
      Environment:
        Variables:
          RAW_BUCKET: !Ref BucketRaw
      Code:
        ZipFile: |
          import json, os, re, datetime, urllib.request, boto3
          s3 = boto3.client("s3")
          BUCKET = os.environ["RAW_BUCKET"]
          BASE = "https://api.github.com/advisories"
          def sig_pagina(encabezado):
              if not encabezado:
                  return None
              for parte in encabezado.split(","):
                  if 'rel="next"' in parte:
                      return parte[parte.find("<") + 1 : parte.find(">")]
              return None
          def handler(event, context):
              ahora = datetime.datetime.now(datetime.timezone.utc)
              desde = (ahora - datetime.timedelta(hours=26)).strftime("%Y-%m-%dT%H:%M:%S")
              url = f"{BASE}?per_page=100&type=reviewed&updated=%3E%3D{desde}"
              hdr = {"User-Agent": "lti-prototipo", "Accept": "application/vnd.github+json"}
              avisos, paginas = [], 0
              while url and paginas < 10:
                  req = urllib.request.Request(url, headers=hdr)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      avisos += json.loads(r.read())
                      url = sig_pagina(r.headers.get("Link"))
                  paginas += 1
              ghsa = [a for a in avisos if a.get("type") != "malware"]
              tag = ahora.strftime("%Y/%m/%d/%H%M%S")
              s3.put_object(
                  Bucket=BUCKET,
                  Key=f"raw/osv/{tag}.json",
                  Body=json.dumps({"descargado": ahora.isoformat(), "avisos": ghsa}).encode(),
                  ContentType="application/json",
              )
              return {"avisos_osv": len(ghsa), "paginas": paginas, "raw": tag}

  # --- Nucleo en AWS: carga y cruce dentro de la red de la base, orquestados por Step Functions ---
  # --- Normalizacion: S3 Raw -> S3 Curada (no toca la base de datos) ---
  RolNormalizacionCurada:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: raw-a-curada
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BucketRaw.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${BucketRaw.Arn}/raw/*"
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${BucketCurada.Arn}/curada-v3/*"

  FuncionNormalizacionCurada:
    Type: AWS::Lambda::Function
    Properties:
      Tags:
        - Key: activo
          Value: lti-normalizacion
      FunctionName: !Sub "${NombreProyecto}-normalizacion-curada"
      Runtime: python3.12
      Handler: lambda_handlers.normalizacion
      Role: !GetAtt RolNormalizacionCurada.Arn
      Timeout: 300
      MemorySize: 1024
      Code:
        S3Bucket: !Ref BucketCurada
        S3Key: !Sub "artefactos/lti-nucleo-${VersionNucleo}.zip"
      Environment:
        Variables:
          RAW_BUCKET: !Ref BucketRaw
          CURADA_BUCKET: !Ref BucketCurada

  RolCarga:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: lectura-curada
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BucketCurada.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${BucketCurada.Arn}/curada-v3/*"

  RolCruceRDS:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

  RolFlujo:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invocar-lambdas
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  # Solo lo que invoca el flujo v3 (minimo privilegio): sin api-sistema, sin v1, sin Iti-SlackConection1
                  - !GetAtt FuncionConector.Arn
                  - !GetAtt FuncionEPSS.Arn
                  - !GetAtt FuncionOSV.Arn
                  - !GetAtt FuncionNormalizacionCurada.Arn
                  - !GetAtt FuncionApiDatos.Arn
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NombreProyecto}-carga-vulnerabilidades-v2"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NombreProyecto}-cruce-rds-v2"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NombreProyecto}-motor-contextual-shadow"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NombreProyecto}-notificador-rds"
                  - !Ref ArnSlack
                  - !GetAtt FuncionAgenteAsesor.Arn

  FlujoDiario:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${NombreProyecto}-flujo-diario"
      RoleArn: !GetAtt RolFlujo.Arn
      DefinitionString: !Sub
        - |
          {"Comment": "Lyft Threat Intelligence: ingesta selectiva, carga v2, cruce v2, motor contextual (sombra), metricas y notificacion a Slack v2 desde RDS (alertas P1-P3 en cada corrida; resumen de prioridad baja solo con resumen=true)",
           "StartAt": "Ingesta",
           "States": {
            "Ingesta": {"Type":"Parallel","ResultPath":null,"Next":"RutaResumen","Branches":[{"StartAt":"SiNvdKev","States":{"SiNvdKev":{"Type":"Choice","Choices":[{"And":[{"Variable":"$.nvd","IsPresent":true},{"Variable":"$.nvd","BooleanEquals":false}],"Next":"NvdKevOmitida"}],"Default":"NvdKev"},"NvdKev":{"Type":"Task","Resource":"arn:aws:states:::lambda:invoke","Parameters":{"FunctionName":"${ArnNvd}","Payload":{}},"TimeoutSeconds":360,"Retry":[{"ErrorEquals":["States.ALL"],"IntervalSeconds":30,"MaxAttempts":1}],"Catch":[{"ErrorEquals":["States.ALL"],"Next":"NvdKevOmitida"}],"End":true},"NvdKevOmitida":{"Type":"Pass","End":true}}},{"StartAt":"SiEpss","States":{"SiEpss":{"Type":"Choice","Choices":[{"And":[{"Variable":"$.epss","IsPresent":true},{"Variable":"$.epss","BooleanEquals":false}],"Next":"EpssOmitida"}],"Default":"Epss"},"Epss":{"Type":"Task","Resource":"arn:aws:states:::lambda:invoke","Parameters":{"FunctionName":"${ArnEpss}","Payload":{}},"TimeoutSeconds":360,"Retry":[{"ErrorEquals":["States.ALL"],"IntervalSeconds":30,"MaxAttempts":1}],"Catch":[{"ErrorEquals":["States.ALL"],"Next":"EpssOmitida"}],"End":true},"EpssOmitida":{"Type":"Pass","End":true}}},{"StartAt":"SiOsvGhsa","States":{"SiOsvGhsa":{"Type":"Choice","Choices":[{"And":[{"Variable":"$.osv","IsPresent":true},{"Variable":"$.osv","BooleanEquals":false}],"Next":"OsvGhsaOmitida"}],"Default":"OsvGhsa"},"OsvGhsa":{"Type":"Task","Resource":"arn:aws:states:::lambda:invoke","Parameters":{"FunctionName":"${ArnOsv}","Payload":{}},"TimeoutSeconds":360,"Retry":[{"ErrorEquals":["States.ALL"],"IntervalSeconds":30,"MaxAttempts":1}],"Catch":[{"ErrorEquals":["States.ALL"],"Next":"OsvGhsaOmitida"}],"End":true},"OsvGhsaOmitida":{"Type":"Pass","End":true}}}]},
            "Normalizacion": {"Type":"Task","Resource":"arn:aws:states:::lambda:invoke","Parameters":{"FunctionName":"${ArnNorm}","Payload":{}},"TimeoutSeconds":330,"Retry":[{"ErrorEquals":["States.ALL"],"IntervalSeconds":30,"MaxAttempts":1}],"ResultPath":"$.normalizacion_result","Next":"Carga","ResultSelector":{"manifest.$":"$.Payload.manifest"}},
            "Carga": {"Type":"Task","Resource":"arn:aws:states:::lambda:invoke","Parameters":{"FunctionName":"${ArnCargaV2}","Payload":{"manifest.$":"$.normalizacion_result.manifest","sfn_ejecucion_arn.$":"$$.Execution.Id"}},"TimeoutSeconds":900,"Retry":[{"ErrorEquals":["States.ALL"],"IntervalSeconds":30,"MaxAttempts":1}],"ResultPath":"$.carga_result","Next":"Cruce","ResultSelector":{"corrida_id.$":"$.Payload.corrida_id"}},
            "Cruce": {"Type":"Task","Resource":"arn:aws:states:::lambda:invoke","Parameters":{"FunctionName":"${ArnCruceV2}","Payload":{"corrida_id.$":"$.carga_result.corrida_id"}},"TimeoutSeconds":300,"Retry":[{"ErrorEquals":["States.ALL"],"IntervalSeconds":30,"MaxAttempts":1}],"ResultPath":"$.cruce_result","Next":"VerificarCorridaCruce","ResultSelector":{"corrida_id.$":"$.Payload.corrida_id"}},
            "Metricas": {"Type":"Task","Resource":"arn:aws:states:::lambda:invoke","Parameters":{"FunctionName":"${ArnApiDatos}","Payload":{"accion":"snapshot"}},"TimeoutSeconds":60,"Retry":[{"ErrorEquals":["States.ALL"],"IntervalSeconds":20,"MaxAttempts":1}],"ResultPath":null,"Catch":[{"ErrorEquals":["States.ALL"],"ResultPath":null,"Next":"TipoCorrida"}],"Next":"TipoCorrida"},
            "VerificarCorridaCruce": {"Type":"Choice","Choices":[{"Variable":"$.cruce_result.corrida_id","StringEqualsPath":"$.carga_result.corrida_id","Next":"MotorContextual"}],"Default":"ErrorIntegracion"},
            "MotorContextual": {"Type":"Task","Resource":"arn:aws:states:::lambda:invoke","Parameters":{"FunctionName":"${ArnMotor}","Payload":{"corrida_id.$":"$.carga_result.corrida_id"}},"ResultSelector":{"status.$":"$.Payload.status","corrida_id.$":"$.Payload.corrida_id","evaluados.$":"$.Payload.evaluados","errores.$":"$.Payload.errores","listo_para_agente.$":"$.Payload.listo_para_agente","archivo_sombra.$":"$.Payload.archivo_sombra"},"ResultPath":"$.motor_result","Next":"VerificarMotor","Catch":[{"ErrorEquals":["States.ALL"],"ResultPath":"$.motor_error","Next":"ErrorIntegracion"}]},
            "VerificarMotor": {"Type":"Choice","Choices":[{"And":[{"Variable":"$.motor_result.status","StringEquals":"ok"},{"Variable":"$.motor_result.errores","NumericEquals":0},{"Variable":"$.motor_result.corrida_id","StringEqualsPath":"$.carga_result.corrida_id"}],"Next":"HayCasosAgente"}],"Default":"MotorShadowNoListo"},
            "HayCasosAgente": {"Type":"Choice","Comment":"Agente asesor (priorizacion asistida): solo con archivo del motor integro y listo.","Choices":[{"And":[{"Variable":"$.motor_result.listo_para_agente","BooleanEquals":true},{"Variable":"$.motor_result.archivo_sombra","IsNull":false}],"Next":"AgenteListar"}],"Default":"Metricas"},
            "AgenteListar": {"Type":"Task","Resource":"arn:aws:states:::lambda:invoke","Parameters":{"FunctionName":"${ArnAgente}","Payload":{"accion":"listar","corrida_id.$":"$.carga_result.corrida_id","archivo_sombra.$":"$.motor_result.archivo_sombra","modo_demo":${ModoDemoAgente}}},"TimeoutSeconds":60,"ResultSelector":{"casos.$":"$.Payload.casos","total.$":"$.Payload.total","omitidos.$":"$.Payload.omitidos"},"ResultPath":"$.agente_lista","Next":"AgenteAsesorar","Catch":[{"ErrorEquals":["States.ALL"],"ResultPath":"$.agente_error","Next":"AgenteNoDisponible"}]},
            "AgenteAsesorar": {"Type":"Map","Comment":"Un hallazgo por invocacion (sin contaminacion cruzada). Un fallo por caso conserva la evaluacion determinista.","ItemsPath":"$.agente_lista.casos","MaxConcurrency":5,"ItemSelector":{"accion":"asesorar","hallazgo_id.$":"$$.Map.Item.Value","corrida_id.$":"$.carga_result.corrida_id","archivo_sombra.$":"$.motor_result.archivo_sombra","modo_demo":${ModoDemoAgente}},"ItemProcessor":{"ProcessorConfig":{"Mode":"INLINE"},"StartAt":"AsesorarCaso","States":{"AsesorarCaso":{"Type":"Task","Resource":"arn:aws:states:::lambda:invoke","Parameters":{"FunctionName":"${ArnAgente}","Payload.$":"$"},"TimeoutSeconds":150,"Retry":[{"ErrorEquals":["Lambda.TooManyRequestsException","Lambda.ServiceException","Lambda.SdkClientException"],"IntervalSeconds":10,"MaxAttempts":2,"BackoffRate":2}],"OutputPath":"$.Payload","Catch":[{"ErrorEquals":["States.ALL"],"ResultPath":"$.error","Next":"CasoNoAsesorado"}],"End":true},"CasoNoAsesorado":{"Type":"Pass","Parameters":{"hallazgo_id.$":"$.hallazgo_id","estado":"sin_asesoria","motivo":"error_invocacion"},"End":true}}},"ResultPath":"$.agente_resultados","Next":"Metricas","Catch":[{"ErrorEquals":["States.ALL"],"ResultPath":"$.agente_error","Next":"AgenteNoDisponible"}]},
            "AgenteNoDisponible": {"Type":"Pass","Result":{"estado":"parcial","motivo":"Agente no disponible: se conserva la evaluacion determinista"},"ResultPath":"$.agente_advertencia","Next":"Metricas"},
            "ErrorIntegracion": {"Type":"Fail","Error":"CorridaOEvaluacionInconsistente","Cause":"No coincide la corrida o fallo la evaluacion determinista"},
            "MotorShadowNoListo": {"Type":"Pass","Result":{"estado":"requiere_revision","motivo":"Resultado del motor no conforme"},"ResultPath":"$.motor_advertencia","Next":"ErrorIntegracion"},
            "RutaResumen": {"Type":"Choice","Choices":[{"And":[{"Variable":"$.resumen","IsPresent":true},{"Variable":"$.resumen","BooleanEquals":true}],"Next":"Metricas"}],"Default":"Normalizacion"},
            "TipoCorrida": {"Type":"Choice","Comment":"Solo la regla lti-resumen-diario (resumen=true) envia el resumen de prioridad baja.","Choices":[{"And":[{"Variable":"$.resumen","IsPresent":true},{"Variable":"$.resumen","BooleanEquals":true}],"Next":"NotifPrepararResumen"}],"Default":"NotifPrepararAlertas"},
            "NotifPrepararAlertas": {"Type":"Task","Resource":"arn:aws:states:::lambda:invoke","Parameters":{"FunctionName":"${ArnNotifRds}","Payload":{"accion":"preparar","resumen":false}},"TimeoutSeconds":60,"Next":"HayMensajes","Comment":"VPC: reclama y arma mensajes desde RDS. Idempotente (claves unicas): admite reintento.","ResultSelector":{"lote.$":"$.Payload"},"ResultPath":"$.notif","Retry":[{"ErrorEquals":["Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException","Lambda.TooManyRequestsException"],"IntervalSeconds":5,"MaxAttempts":2,"BackoffRate":2}]},
            "NotifPrepararResumen": {"Type":"Task","Resource":"arn:aws:states:::lambda:invoke","Parameters":{"FunctionName":"${ArnNotifRds}","Payload":{"accion":"preparar","resumen":true}},"TimeoutSeconds":60,"Next":"HayMensajes","Comment":"VPC: reclama y arma mensajes desde RDS. Idempotente (claves unicas): admite reintento.","ResultSelector":{"lote.$":"$.Payload"},"ResultPath":"$.notif","Retry":[{"ErrorEquals":["Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException","Lambda.TooManyRequestsException"],"IntervalSeconds":5,"MaxAttempts":2,"BackoffRate":2}]},
            "HayMensajes": {"Type":"Choice","Choices":[{"Variable":"$.notif.lote.total_mensajes","NumericGreaterThan":0,"Next":"NotifEnviar"}],"Default":"SinNotificaciones"},
            "NotifEnviar": {"Type":"Task","Resource":"arn:aws:states:::lambda:invoke","Parameters":{"FunctionName":"${ArnNotifSlack}","Payload":{"mensajes.$":"$.notif.lote.mensajes"}},"TimeoutSeconds":90,"Next":"NotifRegistrar","Comment":"Fuera de VPC: publica en Slack. SIN reintento automatico (evita duplicados); si falla, las filas quedan con lease y se reintentan en la siguiente corrida.","ResultSelector":{"resultados.$":"$.Payload.resultados"},"ResultPath":"$.envio","Catch":[{"ErrorEquals":["States.ALL"],"ResultPath":"$.error_envio","Next":"EnvioNoCompletado"}]},
            "NotifRegistrar": {"Type":"Task","Resource":"arn:aws:states:::lambda:invoke","Parameters":{"FunctionName":"${ArnNotifRds}","Payload":{"accion":"registrar","resultados.$":"$.envio.resultados"}},"TimeoutSeconds":60,"Next":"TodoEntregado","Comment":"VPC: registra el resultado. Idempotente: admite reintento.","ResultSelector":{"registro.$":"$.Payload"},"ResultPath":"$.registro","Retry":[{"ErrorEquals":["Lambda.ServiceException","Lambda.AWSLambdaException","Lambda.SdkClientException","Lambda.TooManyRequestsException"],"IntervalSeconds":5,"MaxAttempts":2,"BackoffRate":2}]},
            "TodoEntregado": {"Type":"Choice","Choices":[{"Variable":"$.registro.registro.fallidas","NumericGreaterThan":0,"Next":"EnvioNoCompletado"}],"Default":"NotificacionesEntregadas"},
            "SinNotificaciones": {"Type":"Succeed","Comment":"No habia nada nuevo que notificar."},
            "NotificacionesEntregadas": {"Type":"Succeed"},
            "EnvioNoCompletado": {"Type":"Fail","Error":"SlackEntregaIncompleta","Cause":"Al menos una notificacion no se entrego. Se reintentara en la siguiente corrida; revisar la tabla notificaciones y los logs del emisor."}
           }
          }
        - ArnNvd: !GetAtt FuncionConector.Arn
          ArnEpss: !GetAtt FuncionEPSS.Arn
          ArnOsv: !GetAtt FuncionOSV.Arn
          ArnNorm: !GetAtt FuncionNormalizacionCurada.Arn
          ArnApiDatos: !GetAtt FuncionApiDatos.Arn
          # Fuera del stack (creadas a mano; se registran en el Mapa de conexiones):
          ArnCargaV2: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NombreProyecto}-carga-vulnerabilidades-v2"
          ArnCruceV2: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NombreProyecto}-cruce-rds-v2"
          ArnMotor: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NombreProyecto}-motor-contextual-shadow"
          ArnNotifRds: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NombreProyecto}-notificador-rds"
          ArnNotifSlack: !Ref ArnSlack
          ArnAgente: !GetAtt FuncionAgenteAsesor.Arn

  RolEventosFlujo:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: iniciar-flujo
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref FlujoDiario

  ReglaFuenteNVD:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${NombreProyecto}-fuente-nvd"
      Description: "Fuente nvd: la frecuencia se cambia desde el panel (Configuracion)"
      # A-1 (24-nov): cada 3 h (antes 1 vez al dia); incluye las 12:00 UTC. Con O-3 el agente no repite casos sin cambios.
      ScheduleExpression: cron(0 0/3 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !Ref FlujoDiario
          Id: flujo
          RoleArn: !GetAtt RolEventosFlujo.Arn
          Input: '{"nvd":true,"epss":false,"osv":false,"resumen":false}'

  ReglaFuenteEPSS:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${NombreProyecto}-fuente-epss"
      Description: "Fuente epss: la frecuencia se cambia desde el panel (Configuracion)"
      ScheduleExpression: cron(15 12 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !Ref FlujoDiario
          Id: flujo
          RoleArn: !GetAtt RolEventosFlujo.Arn
          Input: '{"nvd":false,"epss":true,"osv":false,"resumen":false}'

  ReglaFuenteOSV:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${NombreProyecto}-fuente-osv"
      Description: "Fuente osv: la frecuencia se cambia desde el panel (Configuracion)"
      ScheduleExpression: cron(30 12 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !Ref FlujoDiario
          Id: flujo
          RoleArn: !GetAtt RolEventosFlujo.Arn
          Input: '{"nvd":false,"epss":false,"osv":true,"resumen":false}'

  ReglaResumen:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${NombreProyecto}-resumen-diario"
      Description: "Resumen diario a Slack: la hora se cambia desde el panel (Configuracion)"
      # 14:00 UTC = 08:00 hora de la Ciudad de Mexico (antes 09:00 UTC = 03:00). Esa corrida no invoca al agente.
      ScheduleExpression: cron(0 14 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !Ref FlujoDiario
          Id: flujo
          RoleArn: !GetAtt RolEventosFlujo.Arn
          Input: '{"nvd":false,"epss":false,"osv":false,"resumen":true}'

  # --- CMDB en AWS: Neo4j + Cartography en una instancia, con rol de SOLO LECTURA (sin llaves guardadas) ---
  RolCMDB:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/job-function/ViewOnlyAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: leer-etiquetas
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: tag:GetResources
                Resource: "*"
        - PolicyName: leer-archivos-cmdb
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${BucketCurada.Arn}/artefactos/cmdb/*"
        # C3 / H1 (23-nov): autenticacion IAM a RDS SOLO como u_descubrimiento (sin contrasena en /opt/cmdb/env).
        - PolicyName: conectar-rds-iam-u-descubrimiento
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${BaseDatosRDS.DbiResourceId}/u_descubrimiento"

  PerfilCMDB:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref RolCMDB

  SgCMDB:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Neo4j (navegador 7474 y bolt 7687) solo desde la IP del equipo
      VpcId: !Ref VpcRDS
      # F-6 (22-nov): sin entrada desde internet; Neo4j por tunel SSM (puertos 7474/7687)
      SecurityGroupIngress: []

  InstanciaCMDB:
    Type: AWS::EC2::Instance
    DependsOn: RutaPublica
    Properties:
      ImageId: !Ref ImagenLinuxArm
      InstanceType: t4g.small
      IamInstanceProfile: !Ref PerfilCMDB
      MetadataOptions:
        HttpTokens: required
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetA
          GroupSet:
            - !Ref SgCMDB
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub "${NombreProyecto}-cmdb"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Arranque de la instancia de la CMDB (Neo4j + Cartography). Se ejecuta una sola vez, en el primer inicio.
          exec > >(tee -a /var/log/cmdb-bootstrap.log) 2>&1
          set -u
          BUCKET=${BucketCurada}
          REGION=${AWS::Region}
          NEO4J_PWD=${ClaveNeo4j}

          # 1) Memoria de respaldo: la instancia tiene 2 GB y conviven Neo4j y Cartography
          dd if=/dev/zero of=/swapfile bs=1M count=2048
          chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile

          # 2) Paquetes. Cartography exige Python 3.11 o mas.
          dnf install -y docker python3.11 python3.11-pip python3.11-devel gcc
          systemctl enable --now docker

          # 3) Neo4j Community en Docker, con la memoria acotada para una instancia chica
          mkdir -p /opt/neo4j/data /opt/cmdb
          docker run -d --name neo4j --restart unless-stopped -p 7474:7474 -p 7687:7687 \
            -v /opt/neo4j/data:/data \
            -e NEO4J_AUTH=neo4j/$NEO4J_PWD \
            -e NEO4J_server_memory_heap_initial__size=512m \
            -e NEO4J_server_memory_heap_max__size=512m \
            -e NEO4J_server_memory_pagecache_size=256m \
            neo4j:5-community

          # 4) Cartography y el driver de Neo4j, en un entorno propio
          python3.11 -m venv /opt/cmdb/venv
          /opt/cmdb/venv/bin/pip install --quiet cartography

          # 5) Configuracion (solo root la puede leer)
          cat > /opt/cmdb/env <<EOF
          NEO4J_URI=bolt://localhost:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=$NEO4J_PWD
          BUCKET=$BUCKET
          REGION=$REGION
          AWS_DEFAULT_REGION=$REGION
          EOF
          chmod 600 /opt/cmdb/env

          # 6) Script de sincronizacion: baja la CMDB manual del bucket, la carga, deja que Cartography
          #    descubra la cuenta y vuelve a enlazar lo descubierto con las arquitecturas.
          cat > /opt/cmdb/sincronizar.sh <<'SCRIPT'
          #!/bin/bash
          set -u
          cd /opt/cmdb
          aws s3 cp "s3://$BUCKET/artefactos/cmdb/cargar_cmdb.py" cargar_cmdb.py --region "$REGION" || exit 1
          aws s3 cp "s3://$BUCKET/artefactos/cmdb/activos.csv" activos.csv --region "$REGION" || exit 1
          /opt/cmdb/venv/bin/python cargar_cmdb.py activos.csv
          /opt/cmdb/venv/bin/cartography --neo4j-uri "$NEO4J_URI" --neo4j-user "$NEO4J_USER" \
            --neo4j-password-env-var NEO4J_PASSWORD --selected-modules aws
          /opt/cmdb/venv/bin/python cargar_cmdb.py activos.csv
          SCRIPT
          chmod 700 /opt/cmdb/sincronizar.sh

          # 7) Cada 6 horas
          cat > /etc/systemd/system/cmdb-sync.service <<'UNIT'
          [Unit]
          Description=Sincroniza la CMDB (Neo4j + Cartography)
          After=docker.service
          [Service]
          Type=oneshot
          EnvironmentFile=/opt/cmdb/env
          ExecStart=/opt/cmdb/sincronizar.sh
          TimeoutStartSec=3600
          UNIT
          cat > /etc/systemd/system/cmdb-sync.timer <<'UNIT'
          [Unit]
          Description=Sincroniza la CMDB cada 6 horas
          [Timer]
          OnCalendar=*-*-* 00/6:30:00
          Persistent=true
          [Install]
          WantedBy=timers.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now cmdb-sync.timer

          # 8) Primera sincronizacion, cuando Neo4j ya responde
          for i in $(seq 1 60); do
            docker exec neo4j cypher-shell -u neo4j -p "$NEO4J_PWD" "RETURN 1" >/dev/null 2>&1 && break
            sleep 5
          done
          set -a; . /opt/cmdb/env; set +a
          /opt/cmdb/sincronizar.sh >> /var/log/cmdb-sync.log 2>&1
          echo "arranque terminado"

  # --- Panel: API de datos (lee RDS) y API de sistema (frecuencias y ejecuciones) ---
  RolApiDatos:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        # Solo lectura de las asesorias del agente del tenant Lyft (ruta fija; sin escritura ni otros prefijos).
        - PolicyName: leer-asesorias-agente
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${BucketCurada.Arn}/agente/11111111-1111-1111-1111-111111111111/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BucketCurada.Arn
                Condition:
                  StringLike:
                    s3:prefix: "agente/11111111-1111-1111-1111-111111111111/*"
        # C1 / H1 (23-nov): autenticacion IAM a RDS SOLO como u_dashboard (sin DB_PASSWORD en la funcion).
        - PolicyName: conectar-rds-iam-u-dashboard
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${BaseDatosRDS.DbiResourceId}/u_dashboard"

  FuncionApiDatos:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${NombreProyecto}-api-datos"
      Runtime: python3.12
      Handler: api_datos.handler
      Role: !GetAtt RolApiDatos.Arn
      Timeout: 30
      MemorySize: 512
      Code:
        S3Bucket: !Ref BucketCurada
        S3Key: !Sub "artefactos/lti-nucleo-${VersionNucleo}.zip"
      VpcConfig:
        SubnetIds:
          - !Ref SubnetA
          - !Ref SubnetB
        SecurityGroupIds:
          - !Ref SgLambdaRDS
      Environment:
        Variables:
          DB_HOST: !GetAtt BaseDatosRDS.Endpoint.Address
          DB_AUTH_MODE: iam   # C1: token IAM de 15 min; la contrasena compartida ya no llega a esta funcion
          BUCKET_CURADA: !Ref BucketCurada

  RolApiSistema:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: configuracion-y-ejecuciones
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/lti/configuracion"
              - Effect: Allow
                Action: events:PutRule
                Resource:
                  - !GetAtt ReglaFuenteNVD.Arn
                  - !GetAtt ReglaFuenteEPSS.Arn
                  - !GetAtt ReglaFuenteOSV.Arn
                  - !GetAtt ReglaResumen.Arn
              - Effect: Allow
                Action:
                  - states:ListExecutions
                  - states:StartExecution
                Resource: !Ref FlujoDiario
              - Effect: Allow
                Action: states:DescribeExecution
                Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${NombreProyecto}-flujo-diario:*"
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Ref ArnSlack
              # C1: solo el documento propio con comando fijo y valores permitidos; ya NO AWS-RunShellScript
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanciaCMDB}"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/${DocumentoFrecuenciaCMDB}"
        # Lista de usuarios del panel: SOLO LECTURA sobre este pool (sin crear, cambiar ni borrar).
        - PolicyName: leer-usuarios-cognito
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                  - cognito-idp:ListGroups
                  - cognito-idp:ListUsersInGroup
                  - cognito-idp:AdminListGroupsForUser
                Resource: !GetAtt UsuariosPanel.Arn

  FuncionApiSistema:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${NombreProyecto}-api-sistema"
      Runtime: python3.12
      Handler: api_sistema.handler
      Role: !GetAtt RolApiSistema.Arn
      Timeout: 30
      MemorySize: 256
      Code:
        S3Bucket: !Ref BucketCurada
        S3Key: !Sub "artefactos/lti-nucleo-${VersionNucleo}.zip"
      Environment:
        Variables:
          PARAM_CONFIG: /lti/configuracion
          SLACK_ARN: !Ref ArnSlack
          FLUJO_ARN: !Ref FlujoDiario
          CMDB_ID: !Ref InstanciaCMDB
          REGLA_NVD: !Ref ReglaFuenteNVD
          REGLA_EPSS: !Ref ReglaFuenteEPSS
          REGLA_OSV: !Ref ReglaFuenteOSV
          REGLA_RESUMEN: !Ref ReglaResumen
          USER_POOL_ID: !Ref UsuariosPanel
          DOC_CMDB: !Ref DocumentoFrecuenciaCMDB

  # C1: el panel solo puede cambiar la frecuencia del CMDB a 1, 3, 6, 12 o 24 h; SSM rechaza cualquier otro valor.
  DocumentoFrecuenciaCMDB:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub "${NombreProyecto}-cmdb-frecuencia"
      DocumentType: Command
      Content:
        schemaVersion: "2.2"
        description: Cambia la frecuencia del temporizador cmdb-sync. Solo admite 1, 3, 6, 12 o 24 horas.
        parameters:
          intervalo:
            type: String
            description: Horas entre sincronizaciones del CMDB
            allowedValues: ["1", "3", "6", "12", "24"]
        mainSteps:
          - action: aws:runShellScript
            name: frecuencia
            inputs:
              runCommand:
                - "H='{{ intervalo }}'"
                - 'if [ "$H" = "24" ]; then CAL="*-*-* 00:30:00"; else CAL="*-*-* 00/${H}:30:00"; fi'
                - 'sed -i "s#^OnCalendar=.*#OnCalendar=${CAL}#" /etc/systemd/system/cmdb-sync.timer'
                - systemctl daemon-reload
                - systemctl restart cmdb-sync.timer

  # --- Panel: inicio de sesion (Cognito) ---
  UsuariosPanel:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${NombreProyecto}-panel"
      AliasAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      # C-1: verificacion en dos pasos obligatoria con aplicacion autenticadora (TOTP). Sin SMS ni correo.
      MfaConfiguration: "ON"
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  ClientePanel:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UsuariosPanel
      ClientName: !Sub "${NombreProyecto}-panel-web"
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days

  GrupoAdminPanel:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UsuariosPanel
      GroupName: admin
      Description: Cambia frecuencias, ejecuta fuentes y configura alertas

  GrupoLecturaPanel:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UsuariosPanel
      GroupName: lectura
      Description: Solo ve el panel

  UsuarioAdminPanel:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref UsuariosPanel
      Username: admin
      DesiredDeliveryMediums:
        - EMAIL
      UserAttributes:
        - Name: email
          Value: !Ref EmailAdminPanel
        - Name: email_verified
          Value: "true"

  AdminEnGrupo:
    Type: AWS::Cognito::UserPoolUserToGroupAttachment
    DependsOn: UsuarioAdminPanel
    Properties:
      UserPoolId: !Ref UsuariosPanel
      GroupName: !Ref GrupoAdminPanel
      Username: admin

  # --- Panel: API HTTP con Cognito delante ---
  ApiPanel:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${NombreProyecto}-panel"
      ProtocolType: HTTP

  EtapaApiPanel:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ApiPanel
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      # F-7 (lote 3): registro de acceso por peticion (sin cuerpos ni cabeceras de autorizacion), 30 dias.
      AccessLogSettings:
        DestinationArn: !GetAtt RegistroAccesoApi.Arn
        Format: '{"id":"$context.requestId","ip":"$context.identity.sourceIp","t":"$context.requestTime","metodo":"$context.httpMethod","ruta":"$context.routeKey","estado":"$context.status","bytes":"$context.responseLength","ms":"$context.responseLatency","error_autorizador":"$context.authorizer.error","error_integracion":"$context.integrationErrorMessage"}'

  AutorizadorPanel:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref ApiPanel
      Name: cognito
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - !Ref ClientePanel
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UsuariosPanel}"

  IntegracionDatos:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiPanel
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FuncionApiDatos.Arn
      PayloadFormatVersion: "2.0"

  IntegracionSistema:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiPanel
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FuncionApiSistema.Arn
      PayloadFormatVersion: "2.0"

  RutaDatos:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiPanel
      RouteKey: "GET /api/{proxy+}"
      AuthorizationType: JWT
      AuthorizerId: !Ref AutorizadorPanel
      Target: !Sub "integrations/${IntegracionDatos}"

  RutaSistema:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiPanel
      RouteKey: "ANY /api/sistema/{proxy+}"
      AuthorizationType: JWT
      AuthorizerId: !Ref AutorizadorPanel
      Target: !Sub "integrations/${IntegracionSistema}"

  PermisoApiDatos:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FuncionApiDatos
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiPanel}/*/*/api/*"

  PermisoApiSistema:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FuncionApiSistema
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiPanel}/*/*/api/*"

  # --- Panel: pagina en S3 detras de CloudFront (la misma direccion sirve la pagina y /api/*) ---
  BucketFront:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  AccesoFront:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${NombreProyecto}-front"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DistribucionPanel:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${NombreProyecto} panel"
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: front
            DomainName: !GetAtt BucketFront.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt AccesoFront.Id
          - Id: api
            DomainName: !Sub "${ApiPanel}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: front
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  PoliticaBucketFront:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketFront
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${BucketFront.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistribucionPanel}"

  # ------------------------------------------------------------------ Agente asesor (priorizacion asistida)
  # La IA ASESORA, el motor CALCULA y el dueno APRUEBA. Fuera de la VPC y sin credenciales de base.
  GuardrailAgente:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub "${NombreProyecto}-agente-asesor"
      Description: Ataques de prompt en textos de terceros (feeds y precedentes) y PII/credenciales en la salida.
      BlockedInputMessaging: Entrada bloqueada por el guardrail del agente asesor.
      BlockedOutputsMessaging: Salida bloqueada por el guardrail del agente asesor.
      ContentPolicyConfig:
        FiltersConfig:
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            OutputStrength: NONE
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - {Type: EMAIL, Action: BLOCK}
          - {Type: IP_ADDRESS, Action: BLOCK}
          - {Type: AWS_ACCESS_KEY, Action: BLOCK}
          - {Type: AWS_SECRET_KEY, Action: BLOCK}
          - {Type: PASSWORD, Action: BLOCK}
          - {Type: CREDIT_DEBIT_CARD_NUMBER, Action: BLOCK}
      Tags:
        - Key: activo
          Value: guardrail-agente-lti

  GuardrailAgenteVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt GuardrailAgente.GuardrailId
      Description: v1 - prompt attack HIGH (entrada) + PII/credenciales (salida)

  LogAgenteAsesor:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NombreProyecto}-agente-asesor"
      RetentionInDays: 30

  RolAgenteAsesor:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: agente-asesor-minimo
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${LogAgenteAsesor.Arn}"
              - Sid: LeerSalidaDelMotor
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${NombreProyecto}-motor-shadow-${AWS::AccountId}-${AWS::Region}/risk-engine-shadow/*"
                Condition:
                  StringEquals:
                    s3:ResourceAccount: !Ref AWS::AccountId
              - Sid: LeerModeloDeNegocio
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${BucketCurada.Arn}/contexto/*"
              - Sid: EscribirAsesoria
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${BucketCurada.Arn}/agente/*"
              # O-3 (24-nov): leer sus propias asesorias e indice de reuso para no volver a llamar a Bedrock.
              - Sid: LeerAsesoriasPropias
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${BucketCurada.Arn}/agente/*"
              - Sid: InvocarModelo
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6"
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0"
                  - "arn:aws:bedrock:us-*::foundation-model/anthropic.claude-sonnet-4-6*"
                  - "arn:aws:bedrock:us-*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
              - Sid: AplicarGuardrail
                Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource: !GetAtt GuardrailAgente.GuardrailArn

  FuncionAgenteAsesor:
    Type: AWS::Lambda::Function
    DependsOn: LogAgenteAsesor
    Properties:
      FunctionName: !Sub "${NombreProyecto}-agente-asesor"
      Description: Agente de priorizacion asistida (Bedrock + Guardrail + output guard v2). Sin VPC ni BD.
      Runtime: python3.12
      Handler: agente_asesor.handler
      Role: !GetAtt RolAgenteAsesor.Arn
      Timeout: 120
      MemorySize: 256
      Code:
        S3Bucket: !Ref BucketCurada
        S3Key: !Sub "artefactos/lti-agente-${VersionAgente}.zip"
      Environment:
        Variables:
          TENANT_ID: 11111111-1111-1111-1111-111111111111
          BUCKET_MOTOR: !Sub "${NombreProyecto}-motor-shadow-${AWS::AccountId}-${AWS::Region}"
          BUCKET_CURADA: !Ref BucketCurada
          MODELO_ID: us.anthropic.claude-sonnet-4-6
          GUARDRAIL_ID: !GetAtt GuardrailAgente.GuardrailId
          GUARDRAIL_VERSION: !GetAtt GuardrailAgenteVersion.Version
          MAX_TOKENS: "6000"
          PROMPT_ARCHIVO: sistema_v2_8.md

  PresupuestoBajo:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${NombreProyecto}-alerta-10usd"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 10
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref EmailPresupuesto

  PresupuestoAlto:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${NombreProyecto}-alerta-50usd"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 50
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref EmailPresupuesto

  # 2A (23-nov): el plan gratuito limita la retencion automatica a 1 dia (FreeTierRestrictionError).
  # Compensacion: instantanea manual diaria con rotacion de 7 dias. Solo crea y borra instantaneas con el
  # prefijo lti-rds-diario- de esta instancia; no tiene acceso a datos ni a la red de la base.
  RolRespaldoDiario:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: respaldo-diario-rds
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListarInstantaneas
                Effect: Allow
                Action: rds:DescribeDBSnapshots
                Resource: "*"
              - Sid: CrearDeLaInstancia
                Effect: Allow
                Action: rds:CreateDBSnapshot
                Resource:
                  - !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:${BaseDatosRDS}"
                  - !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:snapshot:lti-rds-diario-*"
              - Sid: EtiquetarYBorrarSoloPropias
                Effect: Allow
                Action: [rds:AddTagsToResource, rds:DeleteDBSnapshot]
                Resource: !Sub "arn:aws:rds:${AWS::Region}:${AWS::AccountId}:snapshot:lti-rds-diario-*"

  FuncionRespaldoDiario:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${NombreProyecto}-respaldo-diario"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt RolRespaldoDiario.Arn
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables:
          INSTANCIA: !Ref BaseDatosRDS
          RETENCION_DIAS: "7"
          MINIMO_CONSERVAR: "3"
      Code:
        ZipFile: |
          """Respaldo diario de lti-rds con instantaneas manuales (compensa el limite de retencion del plan gratuito).

          Crea lti-rds-diario-AAAAMMDD (idempotente) y borra SOLO instantaneas manuales con ese prefijo y mas
          antiguas que RETENCION_DIAS, conservando siempre al menos MINIMO_CONSERVAR (si la creacion fallara varios
          dias seguidos, nunca se queda sin respaldos)."""
          import datetime as dt
          import os

          PREFIJO = "lti-rds-diario-"


          def ejecutar(rds, instancia, retencion_dias=7, minimo=3, ahora=None):
              ahora = ahora or dt.datetime.now(dt.timezone.utc)
              nombre = PREFIJO + ahora.strftime("%Y%m%d")
              pag = rds.get_paginator("describe_db_snapshots")
              propias = [s for p in pag.paginate(DBInstanceIdentifier=instancia, SnapshotType="manual")
                         for s in p["DBSnapshots"] if s["DBSnapshotIdentifier"].startswith(PREFIJO)]
              creada = False
              if not any(s["DBSnapshotIdentifier"] == nombre for s in propias):
                  rds.create_db_snapshot(DBInstanceIdentifier=instancia, DBSnapshotIdentifier=nombre,
                                         Tags=[{"Key": "lti-respaldo", "Value": "diario"}])
                  creada = True
              disponibles = sorted((s for s in propias if s.get("Status") == "available" and s.get("SnapshotCreateTime")),
                                   key=lambda s: s["SnapshotCreateTime"], reverse=True)
              limite = ahora - dt.timedelta(days=retencion_dias)
              borrar = [s["DBSnapshotIdentifier"] for s in disponibles[minimo:] if s["SnapshotCreateTime"] < limite]
              for ident in borrar:
                  rds.delete_db_snapshot(DBSnapshotIdentifier=ident)
              return {"creada": nombre if creada else None, "borradas": borrar, "conservadas": len(disponibles) - len(borrar)}


          def handler(event, context):
              import boto3
              r = ejecutar(boto3.client("rds"), os.environ["INSTANCIA"], int(os.environ.get("RETENCION_DIAS", "7")),
                           int(os.environ.get("MINIMO_CONSERVAR", "3")))
              print(r)
              return r

  ReglaRespaldoDiario:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${NombreProyecto}-respaldo-diario"
      Description: Instantanea diaria de RDS (03:35 hora de Mexico, despues de la ventana de respaldo automatico)
      ScheduleExpression: cron(35 9 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt FuncionRespaldoDiario.Arn
          Id: respaldo-diario

  PermisoReglaRespaldoDiario:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FuncionRespaldoDiario
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReglaRespaldoDiario.Arn

  # ===================== Lote 3: deteccion (NIST 800-61) =====================
  RegistroAccesoApi:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /lti/api-panel/acceso
      RetentionInDays: 30

  # D-2: trail de la cuenta con validacion de integridad; la evidencia ya no depende del historial de 90 dias.
  BucketAuditoria:
    Type: AWS::S3::Bucket
    DependsOn: PermisoS3AlertaIAM
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${NombreProyecto}-auditoria-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt FuncionAlertaIAMTrail.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: !Sub "AWSLogs/${AWS::AccountId}/CloudTrail/us-east-1/"
      LifecycleConfiguration:
        Rules:
          - Id: retencion-180-dias
            Status: Enabled
            ExpirationInDays: 180
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  PoliticaBucketAuditoria:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketAuditoria
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudTrailLeeAcl
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:GetBucketAcl
            Resource: !GetAtt BucketAuditoria.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub "arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${NombreProyecto}-auditoria"
          - Sid: CloudTrailEscribeSoloSuPrefijo
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:PutObject
            Resource: !Sub "${BucketAuditoria.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                aws:SourceArn: !Sub "arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${NombreProyecto}-auditoria"
          - Sid: SoloTLS
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt BucketAuditoria.Arn
              - !Sub "${BucketAuditoria.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  TrailAuditoria:
    Type: AWS::CloudTrail::Trail
    DependsOn: PoliticaBucketAuditoria
    Properties:
      TrailName: !Sub "${NombreProyecto}-auditoria"
      S3BucketName: !Ref BucketAuditoria
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true

  # D-3: alerta a Slack ante cambios que abren superficie o apagan la auditoria (en esta region).
  # Sin IP ni ID de cuenta en el mensaje: solo que paso, en que servicio, quien (principalId) y cuando.
  # Los eventos de IAM (CreateAccessKey, CreateUser...) llegan a EventBridge en us-east-1: van en D-3b (aparte).
  ReglaAlertaCambiosSeguridad:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${NombreProyecto}-alerta-cambios-seguridad"
      Description: Cambios de red, exposicion publica o auditoria -> Slack (D-3)
      State: ENABLED
      EventPattern:
        detail-type: ["AWS API Call via CloudTrail"]
        detail:
          eventSource: [ec2.amazonaws.com, rds.amazonaws.com, lambda.amazonaws.com, s3.amazonaws.com, cloudtrail.amazonaws.com]
          eventName:
            - AuthorizeSecurityGroupIngress
            - ModifySecurityGroupRules
            - ModifyDBInstance
            - CreateFunctionUrlConfig20211031
            - UpdateFunctionUrlConfig20211031
            - PutBucketPolicy
            - PutBucketAcl
            - DeleteBucketPublicAccessBlock
            - PutBucketPublicAccessBlock
            - StopLogging
            - DeleteTrail
            - UpdateTrail
            - PutEventSelectors
      Targets:
        - Arn: !Ref ArnSlack
          Id: slack-cambios
          InputTransformer:
            InputPathsMap:
              evento: "$.detail.eventName"
              servicio: "$.detail.eventSource"
              tipo: "$.detail.userIdentity.type"
              quien: "$.detail.userIdentity.principalId"
              cuando: "$.detail.eventTime"
              region: "$.detail.awsRegion"
            InputTemplate: |
              {"mensajes":[{"ids":[1],"title":"Cambio de seguridad en AWS","body":"<evento> en <servicio> (<region>)\nQuien: <tipo> <quien>\nCuando: <cuando> UTC\nSi no fue un cambio planeado, revisar el evento en CloudTrail."}]}

  PermisoReglaAlertaSlack:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ArnSlack
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReglaAlertaCambiosSeguridad.Arn

  # D-3b v2 (24-nov): la SCP de la organizacion prohibe operar en us-east-1, donde EventBridge entrega los eventos
  # de IAM. Se detectan leyendo los archivos del trail multirregion (prefijo us-east-1) cuando llegan al bucket.
  RolAlertaIAMTrail:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: leer-trail-us-east-1-y-avisar
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${NombreProyecto}-auditoria-${AWS::AccountId}/AWSLogs/${AWS::AccountId}/CloudTrail/us-east-1/*"
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Ref ArnSlack

  FuncionAlertaIAMTrail:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${NombreProyecto}-alerta-iam-trail"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt RolAlertaIAMTrail.Arn
      Timeout: 60
      MemorySize: 256
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          ARN_SLACK: !Ref ArnSlack
      Code:
        ZipFile: |
          """D-3b v2: alerta de cambios IAM leyendo los archivos del trail (la SCP de la organizacion no permite operar en us-east-1)."""
          import gzip, json, os, re, urllib.parse
          import boto3

          EVENTOS = {"CreateUser", "CreateAccessKey", "UpdateAccessKey", "CreateLoginProfile", "UpdateLoginProfile",
                     "DeactivateMFADevice", "AddUserToGroup", "AttachUserPolicy", "PutUserPolicy", "AttachRolePolicy",
                     "PutRolePolicy", "UpdateAssumeRolePolicy", "DeleteRolePermissionsBoundary", "TagUser", "TagRole"}
          MAX_BYTES = 20 * 1024 * 1024
          MAX_LINEAS = 10


          def _limpio(v, n=60):
              return re.sub(r"[^A-Za-z0-9:_.\-]", "?", str(v or "-"))[:n]


          def extraer(registros):
              out = []
              for r in registros:
                  if r.get("eventSource") == "iam.amazonaws.com" and r.get("eventName") in EVENTOS:
                      ui = r.get("userIdentity") or {}
                      out.append("%s (%s) | %s %s | %s UTC" % (
                          _limpio(r["eventName"]), "fallido" if r.get("errorCode") else "aplicado",
                          _limpio(ui.get("type"), 20), _limpio(ui.get("principalId")), _limpio(r.get("eventTime"), 25)))
              return out


          def mensaje(lineas):
              extra = len(lineas) - MAX_LINEAS
              cuerpo = "\n".join(lineas[:MAX_LINEAS]) + (f"\n(+{extra} mas en CloudTrail)" if extra > 0 else "")
              cuerpo += "\nSi no fue un cambio planeado (despliegue revisado), revisar el evento en CloudTrail."
              return {"mensajes": [{"ids": [1], "title": "Cambio de identidades (IAM) en AWS", "body": cuerpo}]}


          def handler(event, context, s3=None, lam=None):
              s3 = s3 or boto3.client("s3"); lam = lam or boto3.client("lambda")
              lineas = []
              for rec in event.get("Records", []):
                  b = rec["s3"]["bucket"]["name"]; k = urllib.parse.unquote_plus(rec["s3"]["object"]["key"])
                  if "/CloudTrail/us-east-1/" not in k or not k.endswith(".json.gz") or rec["s3"]["object"].get("size", 0) > MAX_BYTES:
                      continue
                  datos = json.loads(gzip.decompress(s3.get_object(Bucket=b, Key=k)["Body"].read()))
                  lineas += extraer(datos.get("Records", []))
              if not lineas:
                  return {"alertas": 0}
              r = lam.invoke(FunctionName=os.environ["ARN_SLACK"], Payload=json.dumps(mensaje(lineas)).encode())
              print("alertas_iam:", len(lineas), "estado:", r.get("StatusCode"))
              return {"alertas": len(lineas)}

  PermisoS3AlertaIAM:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FuncionAlertaIAMTrail
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::${NombreProyecto}-auditoria-${AWS::AccountId}"

  # O-1 (24-nov): una corrida que termina en FAILED (motor caido o no conforme, ErrorIntegracion) avisa a Slack.
  ReglaAlertaFlujoFallido:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${NombreProyecto}-alerta-flujo-fallido"
      Description: Ejecucion del flujo diario en FAILED, TIMED_OUT o ABORTED -> Slack (O-1)
      State: ENABLED
      EventPattern:
        source: [aws.states]
        detail-type: ["Step Functions Execution Status Change"]
        detail:
          status: [FAILED, TIMED_OUT, ABORTED]
          stateMachineArn: [!Ref FlujoDiario]
      Targets:
        - Arn: !Ref ArnSlack
          Id: slack-flujo-fallido
          InputTransformer:
            InputPathsMap:
              estado: "$.detail.status"
              ejecucion: "$.detail.name"
              cuando: "$.time"
            InputTemplate: |
              {"mensajes":[{"ids":[1],"title":"Flujo diario sin completar","body":"Estado: <estado>\nEjecucion: <ejecucion>\nCuando: <cuando> UTC\nLa corrida no publico resultados. Revisar el historial de la ejecucion en Step Functions (motor o integracion)."}]}

  PermisoReglaAlertaFlujo:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ArnSlack
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReglaAlertaFlujoFallido.Arn


AWSTemplateFormatVersion: "2010-09-09"
Description: Prototipo LTI (Camino B) - componentes de bajo costo. Los componentes de produccion (Network Firewall, EKS, MSK, Aurora, NAT, Neptune, Redshift) se documentan y no se crean.

Parameters:
  EmailPresupuesto:
    Type: String
    Description: Correo que recibe las alertas de presupuesto
  NombreProyecto:
    Type: String
    Default: lti
    AllowedPattern: "[a-z0-9-]{1,12}"
  ClaveRDS:
    Type: String
    NoEcho: true
    Description: Clave maestra de la base RDS. Siempre se pasa en el deploy (desplegar.sh la lee de .env.local); sin valor por defecto.
    MinLength: 8
  ClaveUsuarios:
    Type: String
    NoEcho: true
    Description: Clave de los usuarios de la base (u_ingesta, u_cruce...). La misma que se uso en rds_crear_esquema.py --clave-usuarios.
    MinLength: 8
  VersionNucleo:
    Type: String
    Default: v6
    AllowedPattern: "[a-z0-9.-]{1,20}"
    Description: Version del paquete lti-nucleo-<version>.zip en s3://<bucket curada>/artefactos/. Cambiala cada vez que subas un paquete nuevo.
  ArnSlack:
    Type: String
    Default: arn:aws:lambda:us-east-2:208805233219:function:lti-notificador-slack
    AllowedPattern: "arn:aws:lambda:[a-z0-9-]+:[0-9]{12}:function:[A-Za-z0-9_-]+"
    Description: Emisor de Slack v2 (lti-notificador-slack, fuera del stack). Recibe {"mensajes":[{ids,title,body}]}.
  EmailAdminPanel:
    Type: String
    AllowedPattern: "[^@ ]+@[^@ ]+\\.[^@ ]+"
    Description: Correo de la primera persona administradora del panel. Cognito le envia ahi su contrasena temporal.
  ClaveNeo4j:
    Type: String
    NoEcho: true
    AllowedPattern: "[A-Za-z0-9]{8,64}"
    Description: Contrasena del usuario neo4j de la CMDB. Solo letras y numeros, minimo 8.
  ImagenLinuxArm:
    Type: AWS::EC2::Image::Id
    Description: >-
      AMI de la CMDB. desplegar.sh pasa la de la instancia que ya corre. Antes era el parametro SSM
      "latest" de Amazon Linux 2023, que cambia solo cuando AWS publica una imagen nueva y provocaba el
      REEMPLAZO de la instancia (y la perdida de Neo4j) en cualquier despliegue.
  VersionAgente:
    Type: String
    Default: a2
    AllowedPattern: "[a-z0-9.-]{1,20}"
    Description: Version del paquete lti-agente-<version>.zip en s3://<bucket curada>/artefactos/ (agente asesor).
  ModoDemoAgente:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: true envia los casos al agente (demostracion); false aplica la politica de enrutamiento (P1/P2, KEV, ambiguos).
  IPPermitida:
    Type: String
    Description: Tu IP publica actual, en formato CIDR (ej. 187.190.12.34/32). Solo esa IP podra conectarse a RDS.
    AllowedPattern: "(\\d{1,3}\\.){3}\\d{1,3}/32"

Resources:
  # --- Red privada minima para RDS (sin NAT Gateway: nada en esta VPC necesita salir a internet) ---
  VpcRDS:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.50.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcRDS
      CidrBlock: 10.50.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcRDS
      CidrBlock: 10.50.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  TablaRutas:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcRDS

  AsociarRutaA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref TablaRutas

  AsociarRutaB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref TablaRutas

  IGW:
    Type: AWS::EC2::InternetGateway

  AdjuntarIGW:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VpcRDS
      InternetGatewayId: !Ref IGW

  RutaPublica:
    Type: AWS::EC2::Route
    DependsOn: AdjuntarIGW
    Properties:
      RouteTableId: !Ref TablaRutas
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW

  # Endpoint de S3 (gratis): permite que las Lambdas en la VPC lean/escriban S3
  # sin necesitar NAT Gateway ni salida a internet.
  EndpointS3:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcRDS
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds:
        - !Ref TablaRutas
      VpcEndpointType: Gateway

  GrupoSubredesRDS:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subredes privadas para RDS
      SubnetIds:
        - !Ref SubnetA
        - !Ref SubnetB

  SgRDS:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Solo acepta Postgres desde las Lambdas de normalizacion y cruce
      VpcId: !Ref VpcRDS

  SgLambdaRDS:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambdas que necesitan hablar con RDS
      VpcId: !Ref VpcRDS

  ReglaRDSDesdeLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SgRDS
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      Description: "Lambdas de la VPC (SgLambdaRDS)"
      SourceSecurityGroupId: !Ref SgLambdaRDS

  ReglaRDSDesdeMiIP:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SgRDS
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      Description: "Administracion: IP fija del equipo (IP_PERMITIDA en .env.local)"
      CidrIp: !Ref IPPermitida

  ReglaRDSDesdeCMDB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SgRDS
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      Description: "CMDB Neo4j/Cartography (SgCMDB)"
      SourceSecurityGroupId: !Ref SgCMDB

  BaseDatosRDS:
    Type: AWS::RDS::DBInstance
    # Snapshot: si alguien borra el stack, la base no desaparece sin respaldo.
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Tags:
        - Key: activo
          Value: aurora-lti
      DBInstanceIdentifier: !Sub "${NombreProyecto}-rds"
      Engine: postgres
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageType: gp2
      MasterUsername: lti_app
      MasterUserPassword: !Ref ClaveRDS
      DBName: lti
      DBSubnetGroupName: !Ref GrupoSubredesRDS
      VPCSecurityGroups:
        - !Ref SgRDS
      PubliclyAccessible: true
      MultiAZ: false
      # Cambios aplicados SIN reemplazo ni reinicio (verificar en el change set que Replacement = False):
      EnableIAMDatabaseAuthentication: true   # ya activo desde el 19-nov (R3): formaliza la deriva
      # Se mantiene en 1: el change set marco el cambio a 7 como "RequiresRecreation: Conditionally".
      # Pasar a 7 dias queda para despues de la demo (en una ventana con instantanea manual previa).
      BackupRetentionPeriod: 1
      DeletionProtection: true
      # NO agregar StorageEncrypted aqui: cambiarlo REEMPLAZA la instancia (base nueva y vacia).
      # El cifrado en reposo se hace despues de la demo con instantanea cifrada + restauracion.

  BucketRaw:
    Type: AWS::S3::Bucket
    Properties:
      Tags:
        - Key: activo
          Value: s3-raw-lti
      BucketName: !Sub "${NombreProyecto}-raw-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expirar-raw-90-dias
            Status: Enabled
            ExpirationInDays: 90

  BucketCurada:
    Type: AWS::S3::Bucket
    Properties:
      Tags:
        - Key: activo
          Value: s3-curada-lti
      BucketName: !Sub "${NombreProyecto}-curada-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SecretoNVD:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${NombreProyecto}/nvd"
      Description: Clave gratuita de la API de NVD. Reemplazar PENDIENTE con la clave real.
      SecretString: '{"api_key":"PENDIENTE"}'

  SecretoSlack:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${NombreProyecto}/slack"
      Description: URL del webhook de Slack del canal de alertas. Reemplazar PENDIENTE.
      SecretString: '{"webhook_url":"PENDIENTE"}'

  RolConector:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: minimo-privilegio
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${BucketRaw.Arn}/raw/*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SecretoNVD

  FuncionConector:
    Type: AWS::Lambda::Function
    Properties:
      Tags:
        - Key: activo
          Value: lti-conector-api
      FunctionName: !Sub "${NombreProyecto}-conector-nvd-kev"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt RolConector.Arn
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          RAW_BUCKET: !Ref BucketRaw
          NVD_SECRET: !Ref SecretoNVD
      Code:
        ZipFile: |
          import json, os, time, datetime, urllib.request, urllib.parse, boto3
          s3 = boto3.client("s3")
          sm = boto3.client("secretsmanager")
          BUCKET = os.environ["RAW_BUCKET"]
          SECRETO = os.environ["NVD_SECRET"]
          KEV_URL = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
          def get(url, headers=None):
              for intento in range(4):
                  try:
                      req = urllib.request.Request(url, headers=headers or {"User-Agent": "lti-prototipo"})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return r.read()
                  except urllib.error.HTTPError as e:
                      if e.code in (403, 429) and intento < 3:
                          time.sleep(8 * (intento + 1)); continue
                      raise
          def handler(event, context):
              ahora = datetime.datetime.now(datetime.timezone.utc)
              desde = ahora - datetime.timedelta(hours=26)
              clave = json.loads(sm.get_secret_value(SecretId=SECRETO)["SecretString"]).get("api_key", "")
              hdr = {"User-Agent": "lti-prototipo"}
              if clave and clave != "PENDIENTE":
                  hdr["apiKey"] = clave
              fmt = "%Y-%m-%dT%H:%M:%S.000+00:00"
              cves, inicio, total = [], 0, None
              while total is None or inicio < total:
                  q = urllib.parse.urlencode({"lastModStartDate": desde.strftime(fmt),
                                              "lastModEndDate": ahora.strftime(fmt),
                                              "startIndex": inicio, "resultsPerPage": 2000})
                  datos = json.loads(get("https://services.nvd.nist.gov/rest/json/cves/2.0?" + q, hdr))
                  total = datos.get("totalResults", 0)
                  cves += [v["cve"] for v in datos.get("vulnerabilities", [])]
                  inicio += 2000
                  time.sleep(1 if clave else 6)
              tag = ahora.strftime("%Y/%m/%d/%H%M%S")
              s3.put_object(Bucket=BUCKET, Key=f"raw/nvd/{tag}.json",
                            Body=json.dumps({"descargado": ahora.isoformat(), "cves": cves}).encode(),
                            ContentType="application/json")
              kev = get(KEV_URL)
              s3.put_object(Bucket=BUCKET, Key=f"raw/kev/{tag}.json", Body=kev, ContentType="application/json")
              return {"cves_nvd": len(cves), "kev_bytes": len(kev), "raw": tag}

  FuncionEPSS:
    Type: AWS::Lambda::Function
    Properties:
      Tags:
        - Key: activo
          Value: lti-conector-api
      FunctionName: !Sub "${NombreProyecto}-conector-epss"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt RolConector.Arn
      Timeout: 240
      MemorySize: 512
      Environment:
        Variables:
          RAW_BUCKET: !Ref BucketRaw
      Code:
        ZipFile: |
          import gzip, json, csv, os, datetime, urllib.request, boto3
          s3 = boto3.client("s3")
          BUCKET = os.environ["RAW_BUCKET"]
          URL = "https://epss.cyentia.com/epss_scores-current.csv.gz"
          def handler(event, context):
              req = urllib.request.Request(URL, headers={"User-Agent": "lti-prototipo"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  crudo = r.read()
              texto = gzip.decompress(crudo).decode("utf-8")
              del crudo
              lineas = (l for l in texto.splitlines() if l and not l.startswith("#"))
              lector = csv.DictReader(lineas)
              partes, total = [], 0
              for f in lector:
                  partes.append(f'{{"cve":"{f["cve"]}","epss":{float(f["epss"])},"percentil":{float(f["percentile"])}}}')
                  total += 1
              cuerpo = '{"descargado":"%s","puntajes":[%s]}' % (
                  datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  ",".join(partes),
              )
              ahora = datetime.datetime.now(datetime.timezone.utc)
              tag = ahora.strftime("%Y/%m/%d/%H%M%S")
              s3.put_object(Bucket=BUCKET, Key=f"raw/epss/{tag}.json", Body=cuerpo.encode(), ContentType="application/json")
              return {"cves_epss": total, "raw": tag}

  FuncionOSV:
    Type: AWS::Lambda::Function
    Properties:
      Tags:
        - Key: activo
          Value: lti-conector-api
      FunctionName: !Sub "${NombreProyecto}-conector-osv-ghsa"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt RolConector.Arn
      Timeout: 180
      MemorySize: 256
      Environment:
        Variables:
          RAW_BUCKET: !Ref BucketRaw
      Code:
        ZipFile: |
          import json, os, re, datetime, urllib.request, boto3
          s3 = boto3.client("s3")
          BUCKET = os.environ["RAW_BUCKET"]
          BASE = "https://api.github.com/advisories"
          def sig_pagina(encabezado):
              if not encabezado:
                  return None
              for parte in encabezado.split(","):
                  if 'rel="next"' in parte:
                      return parte[parte.find("<") + 1 : parte.find(">")]
              return None
          def handler(event, context):
              ahora = datetime.datetime.now(datetime.timezone.utc)
              desde = (ahora - datetime.timedelta(hours=26)).strftime("%Y-%m-%dT%H:%M:%S")
              url = f"{BASE}?per_page=100&type=reviewed&updated=%3E%3D{desde}"
              hdr = {"User-Agent": "lti-prototipo", "Accept": "application/vnd.github+json"}
              avisos, paginas = [], 0
              while url and paginas < 10:
                  req = urllib.request.Request(url, headers=hdr)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      avisos += json.loads(r.read())
                      url = sig_pagina(r.headers.get("Link"))
                  paginas += 1
              ghsa = [a for a in avisos if a.get("type") != "malware"]
              tag = ahora.strftime("%Y/%m/%d/%H%M%S")
              s3.put_object(
                  Bucket=BUCKET,
                  Key=f"raw/osv/{tag}.json",
                  Body=json.dumps({"descargado": ahora.isoformat(), "avisos": ghsa}).encode(),
                  ContentType="application/json",
              )
              return {"avisos_osv": len(ghsa), "paginas": paginas, "raw": tag}

  # --- Nucleo en AWS: carga y cruce dentro de la red de la base, orquestados por Step Functions ---
  # --- Normalizacion: S3 Raw -> S3 Curada (no toca la base de datos) ---
  RolNormalizacionCurada:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: raw-a-curada
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BucketRaw.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${BucketRaw.Arn}/raw/*"
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${BucketCurada.Arn}/curada-v3/*"

  FuncionNormalizacionCurada:
    Type: AWS::Lambda::Function
    Properties:
      Tags:
        - Key: activo
          Value: lti-normalizacion
      FunctionName: !Sub "${NombreProyecto}-normalizacion-curada"
      Runtime: python3.12
      Handler: lambda_handlers.normalizacion
      Role: !GetAtt RolNormalizacionCurada.Arn
      Timeout: 300
      MemorySize: 1024
      Code:
        S3Bucket: !Ref BucketCurada
        S3Key: !Sub "artefactos/lti-nucleo-${VersionNucleo}.zip"
      Environment:
        Variables:
          RAW_BUCKET: !Ref BucketRaw
          CURADA_BUCKET: !Ref BucketCurada

  RolCarga:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: lectura-curada
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BucketCurada.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${BucketCurada.Arn}/curada-v3/*"

  RolCruceRDS:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

  FuncionCarga:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${NombreProyecto}-carga-vulnerabilidades"
      Runtime: python3.12
      Handler: lambda_handlers.carga_vulnerabilidades
      Role: !GetAtt RolCarga.Arn
      Timeout: 900
      MemorySize: 1024
      Code:
        S3Bucket: !Ref BucketCurada
        S3Key: !Sub "artefactos/lti-nucleo-${VersionNucleo}.zip"
      VpcConfig:
        SubnetIds:
          - !Ref SubnetA
          - !Ref SubnetB
        SecurityGroupIds:
          - !Ref SgLambdaRDS
      Environment:
        Variables:
          DB_HOST: !GetAtt BaseDatosRDS.Endpoint.Address
          DB_PASSWORD: !Ref ClaveUsuarios
          BUCKET_CURADA: !Ref BucketCurada

  FuncionCruceRDS:
    Type: AWS::Lambda::Function
    Properties:
      Tags:
        - Key: activo
          Value: lti-cruce
      FunctionName: !Sub "${NombreProyecto}-cruce-rds"
      Runtime: python3.12
      Handler: lambda_handlers.cruce
      Role: !GetAtt RolCruceRDS.Arn
      Timeout: 300
      MemorySize: 512
      Code:
        S3Bucket: !Ref BucketCurada
        S3Key: !Sub "artefactos/lti-nucleo-${VersionNucleo}.zip"
      VpcConfig:
        SubnetIds:
          - !Ref SubnetA
          - !Ref SubnetB
        SecurityGroupIds:
          - !Ref SgLambdaRDS
      Environment:
        Variables:
          DB_HOST: !GetAtt BaseDatosRDS.Endpoint.Address
          DB_PASSWORD: !Ref ClaveUsuarios

  RolFlujo:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invocar-lambdas
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  # Solo lo que invoca el flujo v3 (minimo privilegio): sin api-sistema, sin v1, sin Iti-SlackConection1
                  - !GetAtt FuncionConector.Arn
                  - !GetAtt FuncionEPSS.Arn
                  - !GetAtt FuncionOSV.Arn
                  - !GetAtt FuncionNormalizacionCurada.Arn
                  - !GetAtt FuncionApiDatos.Arn
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NombreProyecto}-carga-vulnerabilidades-v2"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NombreProyecto}-cruce-rds-v2"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NombreProyecto}-motor-contextual-shadow"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NombreProyecto}-notificador-rds"
                  - !Ref ArnSlack
                  - !GetAtt FuncionAgenteAsesor.Arn

  FlujoDiario:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${NombreProyecto}-flujo-diario"
      RoleArn: !GetAtt RolFlujo.Arn
      DefinitionString: !Sub
        - |
          {"Comment": "Lyft Threat Intelligence: ingesta selectiva, carga v2, cruce v2, motor contextual (sombra), metricas y notificacion a Slack v2 desde RDS (alertas P1-P3 en cada corrida; resumen de prioridad baja solo con resumen=true)",
           "StartAt": "Ingesta",
           "States": {

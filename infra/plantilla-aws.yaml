        - ArnNvd: !GetAtt FuncionConector.Arn
          ArnEpss: !GetAtt FuncionEPSS.Arn
          ArnOsv: !GetAtt FuncionOSV.Arn
          ArnNorm: !GetAtt FuncionNormalizacionCurada.Arn
          ArnApiDatos: !GetAtt FuncionApiDatos.Arn
          # Fuera del stack (creadas a mano; se registran en el Mapa de conexiones):
          ArnCargaV2: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NombreProyecto}-carga-vulnerabilidades-v2"
          ArnCruceV2: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NombreProyecto}-cruce-rds-v2"
          ArnMotor: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NombreProyecto}-motor-contextual-shadow"
          ArnNotifRds: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NombreProyecto}-notificador-rds"
          ArnNotifSlack: !Ref ArnSlack
          ArnAgente: !GetAtt FuncionAgenteAsesor.Arn

  RolEventosFlujo:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: iniciar-flujo
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref FlujoDiario

  ReglaFuenteNVD:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${NombreProyecto}-fuente-nvd"
      Description: "Fuente nvd: la frecuencia se cambia desde el panel (Configuracion)"
      ScheduleExpression: cron(0 12 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !Ref FlujoDiario
          Id: flujo
          RoleArn: !GetAtt RolEventosFlujo.Arn
          Input: '{"nvd":true,"epss":false,"osv":false,"resumen":false}'

  ReglaFuenteEPSS:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${NombreProyecto}-fuente-epss"
      Description: "Fuente epss: la frecuencia se cambia desde el panel (Configuracion)"
      ScheduleExpression: cron(15 12 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !Ref FlujoDiario
          Id: flujo
          RoleArn: !GetAtt RolEventosFlujo.Arn
          Input: '{"nvd":false,"epss":true,"osv":false,"resumen":false}'

  ReglaFuenteOSV:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${NombreProyecto}-fuente-osv"
      Description: "Fuente osv: la frecuencia se cambia desde el panel (Configuracion)"
      ScheduleExpression: cron(30 12 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !Ref FlujoDiario
          Id: flujo
          RoleArn: !GetAtt RolEventosFlujo.Arn
          Input: '{"nvd":false,"epss":false,"osv":true,"resumen":false}'

  ReglaResumen:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${NombreProyecto}-resumen-diario"
      Description: "Resumen diario a Slack: la hora se cambia desde el panel (Configuracion)"
      # 14:00 UTC = 08:00 hora de la Ciudad de Mexico (antes 09:00 UTC = 03:00). Esa corrida no invoca al agente.
      ScheduleExpression: cron(0 14 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !Ref FlujoDiario
          Id: flujo
          RoleArn: !GetAtt RolEventosFlujo.Arn
          Input: '{"nvd":false,"epss":false,"osv":false,"resumen":true}'

  # --- CMDB en AWS: Neo4j + Cartography en una instancia, con rol de SOLO LECTURA (sin llaves guardadas) ---
  RolCMDB:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/job-function/ViewOnlyAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: leer-etiquetas
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: tag:GetResources
                Resource: "*"
        - PolicyName: leer-archivos-cmdb
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${BucketCurada.Arn}/artefactos/cmdb/*"

  PerfilCMDB:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref RolCMDB

  SgCMDB:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Neo4j (navegador 7474 y bolt 7687) solo desde la IP del equipo
      VpcId: !Ref VpcRDS
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 7474
          ToPort: 7474
          CidrIp: !Ref IPPermitida
        - IpProtocol: tcp
          FromPort: 7687
          ToPort: 7687
          CidrIp: !Ref IPPermitida

  InstanciaCMDB:
    Type: AWS::EC2::Instance
    DependsOn: RutaPublica
    Properties:
      ImageId: !Ref ImagenLinuxArm
      InstanceType: t4g.small
      IamInstanceProfile: !Ref PerfilCMDB
      MetadataOptions:
        HttpTokens: required
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetA
          GroupSet:
            - !Ref SgCMDB
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub "${NombreProyecto}-cmdb"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Arranque de la instancia de la CMDB (Neo4j + Cartography). Se ejecuta una sola vez, en el primer inicio.
          exec > >(tee -a /var/log/cmdb-bootstrap.log) 2>&1
          set -u
          BUCKET=${BucketCurada}
          REGION=${AWS::Region}
          NEO4J_PWD=${ClaveNeo4j}

          # 1) Memoria de respaldo: la instancia tiene 2 GB y conviven Neo4j y Cartography
          dd if=/dev/zero of=/swapfile bs=1M count=2048
          chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile

          # 2) Paquetes. Cartography exige Python 3.11 o mas.
          dnf install -y docker python3.11 python3.11-pip python3.11-devel gcc
          systemctl enable --now docker

          # 3) Neo4j Community en Docker, con la memoria acotada para una instancia chica
          mkdir -p /opt/neo4j/data /opt/cmdb
          docker run -d --name neo4j --restart unless-stopped -p 7474:7474 -p 7687:7687 \
            -v /opt/neo4j/data:/data \
            -e NEO4J_AUTH=neo4j/$NEO4J_PWD \
            -e NEO4J_server_memory_heap_initial__size=512m \
            -e NEO4J_server_memory_heap_max__size=512m \
            -e NEO4J_server_memory_pagecache_size=256m \
            neo4j:5-community

          # 4) Cartography y el driver de Neo4j, en un entorno propio
          python3.11 -m venv /opt/cmdb/venv
          /opt/cmdb/venv/bin/pip install --quiet cartography

          # 5) Configuracion (solo root la puede leer)
          cat > /opt/cmdb/env <<EOF
          NEO4J_URI=bolt://localhost:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=$NEO4J_PWD
          BUCKET=$BUCKET
          REGION=$REGION
          AWS_DEFAULT_REGION=$REGION
          EOF
          chmod 600 /opt/cmdb/env

          # 6) Script de sincronizacion: baja la CMDB manual del bucket, la carga, deja que Cartography
          #    descubra la cuenta y vuelve a enlazar lo descubierto con las arquitecturas.
          cat > /opt/cmdb/sincronizar.sh <<'SCRIPT'
          #!/bin/bash
          set -u
          cd /opt/cmdb
          aws s3 cp "s3://$BUCKET/artefactos/cmdb/cargar_cmdb.py" cargar_cmdb.py --region "$REGION" || exit 1
          aws s3 cp "s3://$BUCKET/artefactos/cmdb/activos.csv" activos.csv --region "$REGION" || exit 1
          /opt/cmdb/venv/bin/python cargar_cmdb.py activos.csv
          /opt/cmdb/venv/bin/cartography --neo4j-uri "$NEO4J_URI" --neo4j-user "$NEO4J_USER" \
            --neo4j-password-env-var NEO4J_PASSWORD --selected-modules aws
          /opt/cmdb/venv/bin/python cargar_cmdb.py activos.csv
          SCRIPT
          chmod 700 /opt/cmdb/sincronizar.sh

          # 7) Cada 6 horas
          cat > /etc/systemd/system/cmdb-sync.service <<'UNIT'
          [Unit]
          Description=Sincroniza la CMDB (Neo4j + Cartography)
          After=docker.service
          [Service]
          Type=oneshot
          EnvironmentFile=/opt/cmdb/env
          ExecStart=/opt/cmdb/sincronizar.sh
          TimeoutStartSec=3600
          UNIT
          cat > /etc/systemd/system/cmdb-sync.timer <<'UNIT'
          [Unit]
          Description=Sincroniza la CMDB cada 6 horas
          [Timer]
          OnCalendar=*-*-* 00/6:30:00
          Persistent=true
          [Install]
          WantedBy=timers.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now cmdb-sync.timer

          # 8) Primera sincronizacion, cuando Neo4j ya responde
          for i in $(seq 1 60); do
            docker exec neo4j cypher-shell -u neo4j -p "$NEO4J_PWD" "RETURN 1" >/dev/null 2>&1 && break
            sleep 5
          done
          set -a; . /opt/cmdb/env; set +a
          /opt/cmdb/sincronizar.sh >> /var/log/cmdb-sync.log 2>&1
          echo "arranque terminado"

  # --- Panel: API de datos (lee RDS) y API de sistema (frecuencias y ejecuciones) ---
  RolApiDatos:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        # Solo lectura de las asesorias del agente del tenant Lyft (ruta fija; sin escritura ni otros prefijos).
        - PolicyName: leer-asesorias-agente
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${BucketCurada.Arn}/agente/11111111-1111-1111-1111-111111111111/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BucketCurada.Arn
                Condition:
                  StringLike:
                    s3:prefix: "agente/11111111-1111-1111-1111-111111111111/*"

  FuncionApiDatos:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${NombreProyecto}-api-datos"
      Runtime: python3.12
      Handler: api_datos.handler
      Role: !GetAtt RolApiDatos.Arn
      Timeout: 30
      MemorySize: 512
      Code:
        S3Bucket: !Ref BucketCurada
        S3Key: !Sub "artefactos/lti-nucleo-${VersionNucleo}.zip"
      VpcConfig:
        SubnetIds:
          - !Ref SubnetA
          - !Ref SubnetB
        SecurityGroupIds:
          - !Ref SgLambdaRDS
      Environment:
        Variables:
          DB_HOST: !GetAtt BaseDatosRDS.Endpoint.Address
          DB_PASSWORD: !Ref ClaveUsuarios
          BUCKET_CURADA: !Ref BucketCurada

  RolApiSistema:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: configuracion-y-ejecuciones
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/lti/configuracion"
              - Effect: Allow
                Action: events:PutRule
                Resource:
                  - !GetAtt ReglaFuenteNVD.Arn
                  - !GetAtt ReglaFuenteEPSS.Arn
                  - !GetAtt ReglaFuenteOSV.Arn
                  - !GetAtt ReglaResumen.Arn
              - Effect: Allow
                Action:
                  - states:ListExecutions
                  - states:StartExecution
                Resource: !Ref FlujoDiario
              - Effect: Allow
                Action: states:DescribeExecution
                Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${NombreProyecto}-flujo-diario:*"
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Ref ArnSlack
              # C1: solo el documento propio con comando fijo y valores permitidos; ya NO AWS-RunShellScript
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanciaCMDB}"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/${DocumentoFrecuenciaCMDB}"

  FuncionApiSistema:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${NombreProyecto}-api-sistema"
      Runtime: python3.12
      Handler: api_sistema.handler
      Role: !GetAtt RolApiSistema.Arn
      Timeout: 30
      MemorySize: 256
      Code:
        S3Bucket: !Ref BucketCurada
        S3Key: !Sub "artefactos/lti-nucleo-${VersionNucleo}.zip"
      Environment:
        Variables:
          PARAM_CONFIG: /lti/configuracion
          SLACK_ARN: !Ref ArnSlack
          FLUJO_ARN: !Ref FlujoDiario
          CMDB_ID: !Ref InstanciaCMDB
          REGLA_NVD: !Ref ReglaFuenteNVD
          REGLA_EPSS: !Ref ReglaFuenteEPSS
          REGLA_OSV: !Ref ReglaFuenteOSV
          REGLA_RESUMEN: !Ref ReglaResumen
          DOC_CMDB: !Ref DocumentoFrecuenciaCMDB

  # C1: el panel solo puede cambiar la frecuencia del CMDB a 1, 3, 6, 12 o 24 h; SSM rechaza cualquier otro valor.
  DocumentoFrecuenciaCMDB:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub "${NombreProyecto}-cmdb-frecuencia"
      DocumentType: Command
      Content:
        schemaVersion: "2.2"
        description: Cambia la frecuencia del temporizador cmdb-sync. Solo admite 1, 3, 6, 12 o 24 horas.
        parameters:
          intervalo:
            type: String
            description: Horas entre sincronizaciones del CMDB
            allowedValues: ["1", "3", "6", "12", "24"]
        mainSteps:
          - action: aws:runShellScript
            name: frecuencia
            inputs:
              runCommand:
                - "H='{{ intervalo }}'"
                - 'if [ "$H" = "24" ]; then CAL="*-*-* 00:30:00"; else CAL="*-*-* 00/${H}:30:00"; fi'
                - 'sed -i "s#^OnCalendar=.*#OnCalendar=${CAL}#" /etc/systemd/system/cmdb-sync.timer'
                - systemctl daemon-reload
                - systemctl restart cmdb-sync.timer

  # --- Panel: inicio de sesion (Cognito) ---
  UsuariosPanel:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${NombreProyecto}-panel"
      AliasAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: "OFF"
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  ClientePanel:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UsuariosPanel
      ClientName: !Sub "${NombreProyecto}-panel-web"
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days

  GrupoAdminPanel:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UsuariosPanel
      GroupName: admin
      Description: Cambia frecuencias, ejecuta fuentes y configura alertas

  GrupoLecturaPanel:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UsuariosPanel
      GroupName: lectura
      Description: Solo ve el panel

  UsuarioAdminPanel:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref UsuariosPanel
      Username: admin
      DesiredDeliveryMediums:
        - EMAIL
      UserAttributes:
        - Name: email
          Value: !Ref EmailAdminPanel
        - Name: email_verified
          Value: "true"

  AdminEnGrupo:
    Type: AWS::Cognito::UserPoolUserToGroupAttachment
    DependsOn: UsuarioAdminPanel
    Properties:
      UserPoolId: !Ref UsuariosPanel
      GroupName: !Ref GrupoAdminPanel
      Username: admin

  # --- Panel: API HTTP con Cognito delante ---
  ApiPanel:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${NombreProyecto}-panel"
      ProtocolType: HTTP

  EtapaApiPanel:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ApiPanel
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25

  AutorizadorPanel:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref ApiPanel
      Name: cognito
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - !Ref ClientePanel
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UsuariosPanel}"

  IntegracionDatos:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiPanel
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FuncionApiDatos.Arn
      PayloadFormatVersion: "2.0"

  IntegracionSistema:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiPanel
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt FuncionApiSistema.Arn
      PayloadFormatVersion: "2.0"

  RutaDatos:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiPanel
      RouteKey: "GET /api/{proxy+}"
      AuthorizationType: JWT
      AuthorizerId: !Ref AutorizadorPanel
      Target: !Sub "integrations/${IntegracionDatos}"

  RutaSistema:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiPanel
      RouteKey: "ANY /api/sistema/{proxy+}"
      AuthorizationType: JWT
      AuthorizerId: !Ref AutorizadorPanel
      Target: !Sub "integrations/${IntegracionSistema}"

  PermisoApiDatos:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FuncionApiDatos
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiPanel}/*/*/api/*"

  PermisoApiSistema:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FuncionApiSistema
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiPanel}/*/*/api/*"

  # --- Panel: pagina en S3 detras de CloudFront (la misma direccion sirve la pagina y /api/*) ---
  BucketFront:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  AccesoFront:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${NombreProyecto}-front"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DistribucionPanel:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${NombreProyecto} panel"
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: front
            DomainName: !GetAtt BucketFront.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt AccesoFront.Id
          - Id: api
            DomainName: !Sub "${ApiPanel}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: front
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  PoliticaBucketFront:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketFront
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${BucketFront.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistribucionPanel}"

  # ------------------------------------------------------------------ Agente asesor (priorizacion asistida)
  # La IA ASESORA, el motor CALCULA y el dueno APRUEBA. Fuera de la VPC y sin credenciales de base.
  GuardrailAgente:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub "${NombreProyecto}-agente-asesor"
      Description: Ataques de prompt en textos de terceros (feeds y precedentes) y PII/credenciales en la salida.
      BlockedInputMessaging: Entrada bloqueada por el guardrail del agente asesor.
      BlockedOutputsMessaging: Salida bloqueada por el guardrail del agente asesor.
      ContentPolicyConfig:
        FiltersConfig:
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            OutputStrength: NONE
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - {Type: EMAIL, Action: BLOCK}
          - {Type: IP_ADDRESS, Action: BLOCK}
          - {Type: AWS_ACCESS_KEY, Action: BLOCK}
          - {Type: AWS_SECRET_KEY, Action: BLOCK}
          - {Type: PASSWORD, Action: BLOCK}
          - {Type: CREDIT_DEBIT_CARD_NUMBER, Action: BLOCK}
      Tags:
        - Key: activo
          Value: guardrail-agente-lti

  GuardrailAgenteVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt GuardrailAgente.GuardrailId
      Description: v1 - prompt attack HIGH (entrada) + PII/credenciales (salida)

  LogAgenteAsesor:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NombreProyecto}-agente-asesor"
      RetentionInDays: 30

  RolAgenteAsesor:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: agente-asesor-minimo
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${LogAgenteAsesor.Arn}"
              - Sid: LeerSalidaDelMotor
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${NombreProyecto}-motor-shadow-${AWS::AccountId}-${AWS::Region}/risk-engine-shadow/*"
                Condition:
                  StringEquals:
                    s3:ResourceAccount: !Ref AWS::AccountId
              - Sid: LeerModeloDeNegocio
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${BucketCurada.Arn}/contexto/*"
              - Sid: EscribirAsesoria
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${BucketCurada.Arn}/agente/*"
              - Sid: InvocarModelo
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-6"
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0"
                  - "arn:aws:bedrock:us-*::foundation-model/anthropic.claude-sonnet-4-6*"
                  - "arn:aws:bedrock:us-*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
              - Sid: AplicarGuardrail
                Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource: !GetAtt GuardrailAgente.GuardrailArn

  FuncionAgenteAsesor:
    Type: AWS::Lambda::Function
    DependsOn: LogAgenteAsesor
    Properties:
      FunctionName: !Sub "${NombreProyecto}-agente-asesor"
      Description: Agente de priorizacion asistida (Bedrock + Guardrail + output guard v2). Sin VPC ni BD.
      Runtime: python3.12
      Handler: agente_asesor.handler
      Role: !GetAtt RolAgenteAsesor.Arn
      Timeout: 120
      MemorySize: 256
      Code:
        S3Bucket: !Ref BucketCurada
        S3Key: !Sub "artefactos/lti-agente-${VersionAgente}.zip"
      Environment:
        Variables:
          TENANT_ID: 11111111-1111-1111-1111-111111111111
          BUCKET_MOTOR: !Sub "${NombreProyecto}-motor-shadow-${AWS::AccountId}-${AWS::Region}"
          BUCKET_CURADA: !Ref BucketCurada
          MODELO_ID: us.anthropic.claude-sonnet-4-6
          GUARDRAIL_ID: !GetAtt GuardrailAgente.GuardrailId
          GUARDRAIL_VERSION: !GetAtt GuardrailAgenteVersion.Version
          MAX_TOKENS: "6000"
          PROMPT_ARCHIVO: sistema_v2_8.md

  PresupuestoBajo:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${NombreProyecto}-alerta-10usd"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 10
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref EmailPresupuesto

  PresupuestoAlto:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${NombreProyecto}-alerta-50usd"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 50
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref EmailPresupuesto

Outputs:
  FuncionAgenteAsesorNombre:
    Value: !Ref FuncionAgenteAsesor
  GuardrailAgenteId:
    Value: !GetAtt GuardrailAgente.GuardrailId
  BucketRawNombre:
    Value: !Ref BucketRaw
  BucketCuradaNombre:
    Value: !Ref BucketCurada
  FuncionConectorNombre:
    Value: !Ref FuncionConector
  FuncionEPSSNombre:
    Value: !Ref FuncionEPSS
  FuncionOSVNombre:
    Value: !Ref FuncionOSV
  BucketCuradaArn:
    Value: !GetAtt BucketCurada.Arn
  FlujoDiarioArn:
    Value: !Ref FlujoDiario
  FuncionNormalizacionCuradaNombre:
    Value: !Ref FuncionNormalizacionCurada
  FuncionCargaNombre:
    Value: !Ref FuncionCarga
  FuncionCruceRDSNombre:
    Value: !Ref FuncionCruceRDS
  CMDBUrl:
    Value: !Sub "http://${InstanciaCMDB.PublicIp}:7474"
  CMDBBolt:
    Value: !Sub "bolt://${InstanciaCMDB.PublicIp}:7687"
  CMDBInstanciaId:
    Value: !Ref InstanciaCMDB
  RDSEndpoint:
    Value: !GetAtt BaseDatosRDS.Endpoint.Address
  RDSPuerto:
    Value: !GetAtt BaseDatosRDS.Endpoint.Port
  PanelUrl:
    Value: !Sub "https://${DistribucionPanel.DomainName}"
  PanelBucket:
    Value: !Ref BucketFront
  PanelDistribucionId:
    Value: !Ref DistribucionPanel
  CognitoUserPoolId:
    Value: !Ref UsuariosPanel
  CognitoClientId:
    Value: !Ref ClientePanel
  ApiPanelId:
    Value: !Ref ApiPanel
